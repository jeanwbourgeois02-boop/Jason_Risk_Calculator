# Copied unchanged (apart from this header) on 2026-09-24 by the contract-master lane from the
# research app: Commodity Dashboard/rvapp/universe/spreads/agriculture.yaml. A template only: nothing in
# the app reads it yet (spreads-engine, Phase 3). Leg `instrument` values are contract roots
# (config/contracts.csv root_id).
# Agriculture spreads. One entry per spread; calendars come from calendar_rules.yaml.
# Destination: rvapp/universe/spreads/agriculture.yaml.
# Format: rvapp/universe/validate.py. `params` extensions are the ferrous ones (research/ferrous/NOTES.md):
#   vat_basis, tenor_anchor, arb_bound, conversion_cost(+_range), desk_convention; plus `tradable: signal_only`.
# Nothing here has been reviewed by a human: verified is false everywhere.
#
# Bushel legs: the validator treats `bu` as its own dimension, so a bushel leg inside a mass-unit
# spread (or a mass leg inside a USD/bu spread) carries qty_factor even though units.py could convert
# it from BUSHEL_LB. Factors used (all from the standard bushel weights):
#   t per bu  soybeans, wheat (60 lb) = 60 * 0.45359237 / 1000 = 0.0272155
#   t per bu  corn (56 lb)            = 56 * 0.45359237 / 1000 = 0.0254012
#   cwt per bu corn                   = 56 / 100               = 0.56
#   bu (60 lb) per short ton          = 2000 / 60              = 33.3333
#   bu (60 lb) per lb                 = 1 / 60                 = 0.0166667

# =====================================================================
# BENCHMARK - same commodity, different venue, grade or location
# =====================================================================

- id: bench.soy.dce_b_vs_cbot
  family: benchmark
  name: DCE No.2 soybeans vs CBOT soybeans
  sector: agriculture
  legs:
    - {instrument: DCE:B,   weight: 1.0}
    - {instrument: CBOT:ZS, weight: -1.0, qty_factor: 0.0272155}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [soy_import_arb, china_import_arb, us_china_trade]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: DCE:B
    arb_bound:
      type: import_parity
      onshore_leg: DCE:B
      offshore_leg: CBOT:ZS
      freight_usd_t: 45          # US Gulf-China Panamax; Brazil Santos-China about 35-40
      other_usd_t: 35            # FOB basis over futures, about 1 USD/bu; swings -0.3 to +2.5
      import_duty: 0.03          # MFN. US origin carries an extra retaliatory tariff (10% after the Nov 2025 truce; confidence: low)
      vat_rate: 0.09
      port_charges_cny_t: 120
      formula: "parity_cny_t = (offshore_usd_bu / 0.0272155 + other_usd_t + freight_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t"
  notes: >-
    Imported-bean parity. 1 bu = 60 lb = 0.0272155 t, so USD/t = USD/bu x 36.74. China buys
    mostly Brazilian beans priced as CBOT + basis, so the real arb variable is the basis, which
    has no futures; this row shows how much of it the board already pays. DCE:B is thin:
    treat big moves with suspicion. US-origin tariff changes (2018, 2025) shift the level.

