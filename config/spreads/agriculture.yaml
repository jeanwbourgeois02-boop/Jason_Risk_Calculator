- id: bench.cotton.zce_vs_ice
  family: benchmark
  name: ZCE cotton vs ICE cotton No.2
  sector: agriculture
  legs:
    - {instrument: ZCE:CF,   weight: 1.0}
    - {instrument: ICEUS:CT, weight: -1.0}
  unit: USD/lb
  fx: USDCNH
  tenor: main
  driver_tags: [cotton_import_arb, china_import_arb, xinjiang_cotton]
  verified: false
  params:
    vat_basis: ex_vat
    desk_convention: "China quotes the gap in CNY/t: CF minus the 1%-duty landed cost of ICE"
    arb_bound:
      type: import_parity
      onshore_leg: ZCE:CF
      offshore_leg: ICEUS:CT
      freight_usd_t: 0           # inside the CFR basis below
      other_usd_t: 250           # CFR Far East basis over ICE, about 11 c/lb for US/Brazilian M 1-1/8
      import_duty: 0.01          # inside the 894 kt quota; sliding-scale duty (up to 40%) outside
      vat_rate: 0.09
      port_charges_cny_t: 200
      formula: "parity_cny_t = (offshore_usd_lb * 2204.62 + other_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t  (freight is inside the CFR basis)"
  notes: >-
    USD/lb: CNY/t / FX / 2204.62 (engine converts). Quota-bound like corn and sugar, so the
    gap can stay open for months. Since the 2021 Xinjiang import bans the two markets serve
    different textile chains (CF clothes China, CT clothes exports to the West), which weakens
    cointegration. Each leg on its own main contract, as the desk quotes it. The basis number
    is confidence: low; freight_usd_t is not added separately.

- id: bench.sugar.zce_vs_ice11
  family: benchmark
  name: ZCE white sugar vs ICE raw sugar No.11
  sector: agriculture
  legs:
    - {instrument: ZCE:SR,   weight: 1.0}
    - {instrument: ICEUS:SB, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [sugar_import_arb, china_import_arb]
  verified: false
  params:
    vat_basis: ex_vat
    arb_bound:
      type: import_parity
      onshore_leg: ZCE:SR
      offshore_leg: ICEUS:SB
      freight_usd_t: 45
      other_usd_t: 10            # polarisation premium and Brazil FOB basis
      import_duty: 0.15          # inside the 1.945 Mt quota; 50% outside
      vat_rate: 0.13
      port_charges_cny_t: 450    # discharge plus refining raws into whites, about 350-400
      formula: "parity_cny_t = (offshore_usd_lb * 2204.62 + other_usd_t + freight_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t"
  notes: >-
    Raw against refined, so the refining cost sits in the bound. Desks track both the 15% and
    the 50% parity; ZCE normally trades between them, and out-of-quota imports open only when
    it reaches the upper one. Syrup and premix imports (Thailand) are the leak; the 2025
    curbs on them tightened the link. Each leg on its own main contract.

- id: bench.rubber.ru_vs_nr
  family: benchmark
  name: SHFE natural rubber vs INE TSR 20
  sector: agriculture
  legs:
    - {instrument: SHFE:RU, weight: 1.0}
    - {instrument: INE:NR,  weight: -1.0}
  unit: CNY/t
  tenor: main
  driver_tags: [rubber_grade_spread, rubber_warrant_cycle]
  verified: false
  params:
    desk_convention: "RU main (01/05/09) minus NR main (monthly); quoted as the RU-NR spread"
  notes: >-
    Whole-field latex / RSS3 (duty and VAT paid) against bonded TSR 20 (no duty, no VAT), so
    about 1,500-2,000 CNY/t of the level is tax. The rest is the grade premium and the RU
    warrant cycle: RU warrants die every November, so RU09 converges down to spot while RU01
    carries a premium. The classic trade is short RU / long NR into September delivery.
    Tyre makers use TSR 20, so NR follows demand; RU follows Yunnan/Hainan supply and stocks.

- id: bench.rubber.nr_vs_sgx_tsr20
  family: benchmark
  name: INE TSR 20 vs SGX TSR 20
  sector: agriculture
  legs:
    - {instrument: INE:NR, weight: 1.0}
    - {instrument: SGX:TF, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [rubber_venue_basis, cnh]
  verified: false
  params:
    vat_basis: inc_vat           # NR is bonded: nothing to strip
    tenor_anchor: INE:NR
    arb_bound:
      type: import_parity
      onshore_leg: INE:NR
      offshore_leg: SGX:TF
      freight_usd_t: 25          # Thai/Indonesian port to Qingdao bonded warehouse; SGX is FOB
      import_duty: 0.0
      vat_rate: 0.0
      formula: "parity_cny_t = (offshore_usd_kg * 1000 + freight_usd_t) * USDCNH"
  notes: >-
    Same grade, both free of Chinese tax: the cleanest cross-border arb in the book, and both
    legs are open to foreigners. USD/kg x 1000 = USD/t (engine converts). Deviation is
    freight, CNH and Qingdao bonded stocks. Same delivery month on both legs.

