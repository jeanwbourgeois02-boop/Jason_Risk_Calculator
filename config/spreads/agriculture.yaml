- id: bench.palm.dce_vs_bmd
  family: benchmark
  name: DCE palm olein vs Bursa crude palm oil
  sector: agriculture
  legs:
    - {instrument: DCE:P,    weight: 1.0}
    - {instrument: BMD:FCPO, weight: -1.0}
  unit: USD/t
  fx: [USDCNH, USDMYR]
  tenor: main
  driver_tags: [palm_import_arb, china_import_arb]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: DCE:P
    arb_bound:
      type: import_parity
      onshore_leg: DCE:P
      offshore_leg: BMD:FCPO
      freight_usd_t: 30
      grade_adjustment_usd_t: 25   # RBD olein FOB over CPO futures: refining margin plus Malaysian CPO export tax pass-through; -10 to +60
      import_duty: 0.09
      vat_rate: 0.09
      port_charges_cny_t: 100
      formula: "parity_cny_t = (offshore_myr_t / USDMYR + grade_adjustment_usd_t + freight_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t"
  notes: >-
    The palm import margin, the most watched number on Chinese vegoil desks. Grades differ
    (refined olein against crude), hence the grade adjustment. Chinese importers hedge by
    buying FCPO and selling DCE:P, so the spread mean-reverts around parity with a short
    half-life. Indonesian export levies move the olein-CPO premium without touching FCPO.

