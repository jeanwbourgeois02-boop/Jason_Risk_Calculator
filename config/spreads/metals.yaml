# ---- precious ----
- id: sub.pm.gold_vs_silver_comex
  family: substitution
  name: Gold / silver ratio (COMEX)
  sector: metals
  legs:
    - {instrument: COMEX:GC, weight: 1.0}
    - {instrument: COMEX:SI, weight: -1.0}
  unit: USD/oz
  tenor: main
  driver_tags: [precious_ratio, macro_haven_vs_industrial]
  verified: false
  params:
    desk_convention: "the ratio GC / SI; the difference is meaningless"
  notes: >-
    The most watched ratio in metals. Rises in risk-off and deflation scares (above 100 in
    2020 and April 2025), falls when silver's industrial half (solar, electronics) leads.
    Main vs main: GC and SI share only the Dec month, so it carries up to two months of carry.

- id: sub.pm.gold_vs_silver_shfe
  family: substitution
  name: Gold / silver ratio (SHFE)
  sector: metals
  legs:
    - {instrument: SHFE:AU, weight: 1.0}
    - {instrument: SHFE:AG, weight: -1.0}
  unit: CNY/g
  tenor: main
  driver_tags: [precious_ratio]
  verified: false
  params:
    desk_convention: "AU in CNY/g x 1000 / AG in CNY/kg. About 11.5% below the COMEX ratio because SHFE silver includes 13% VAT and gold does not"
  notes: >-
    The onshore version, same even-month cycle on both legs. Against the COMEX ratio it
    isolates the Chinese silver premium from the gold premium.

- id: sub.pm.platinum_vs_palladium_nymex
  family: substitution
  name: Platinum / palladium ratio (NYMEX)
  sector: metals
  legs:
    - {instrument: NYMEX:PL, weight: 1.0}
    - {instrument: NYMEX:PA, weight: -1.0}
  unit: USD/oz
  tenor: main
  driver_tags: [pgm_ratio, autocatalyst_substitution]
  verified: false
  notes: >-
    True substitution: autocatalyst makers swap platinum into gasoline catalysts when palladium
    is dear, with a 2-3 year lag. Palladium went from half of platinum (2016) to 2.5x (2021)
    and back below par (2024-25). EV share and Russian supply (40% of palladium) drive it.

- id: sub.pm.platinum_vs_palladium_gfex
  family: substitution
  name: Platinum / palladium ratio (GFEX)
  sector: metals
  legs:
    - {instrument: GFEX:PT, weight: 1.0}
    - {instrument: GFEX:PD, weight: -1.0}
  unit: CNY/g
  tenor: main
  driver_tags: [pgm_ratio, autocatalyst_substitution]
  verified: false
  notes: >-
    Onshore mirror, same months and same VAT on both legs. History from 27 Nov 2025.

- id: sub.pm.platinum_vs_gold
  family: substitution
  name: Platinum / gold ratio
  sector: metals
  legs:
    - {instrument: NYMEX:PL, weight: 1.0}
    - {instrument: COMEX:GC, weight: -1.0}
  unit: USD/oz
  tenor: main
  driver_tags: [precious_ratio, macro_haven_vs_industrial]
  verified: false
  notes: >-
    Industrial precious vs monetary precious; jewellery buyers switch when the gap is extreme.
    Above 1 before 2015, a record low near 0.3 in early 2025, then platinum's 2025 rally.

- id: sub.pm.platinum_vs_gold_cn
  family: substitution
  name: Platinum / gold ratio (GFEX vs SHFE)
  sector: metals
  legs:
    - {instrument: GFEX:PT, weight: 1.0}
    - {instrument: SHFE:AU, weight: -1.0}
  unit: CNY/g
  tenor: main
  driver_tags: [precious_ratio, china_jewellery]
  verified: false
  notes: >-
    Chinese jewellery fabricators and retail buyers moved into platinum in 2025 as gold became
    unaffordable; this is where that substitution is priced. Platinum leg includes 13% VAT,
    gold does not. History from 27 Nov 2025.

# ---- base ----
- id: sub.lme.copper_vs_aluminium
  family: substitution
  name: Copper / aluminium ratio (LME)
  sector: metals
  legs:
    - {instrument: LME:CA, weight: 1.0}
    - {instrument: LME:AH, weight: -1.0}
  unit: USD/t
  tenor: m+2
  driver_tags: [base_ratio, cu_al_substitution]
  verified: false
  params:
    desk_convention: "the ratio Cu / Al on LME 3-month prices; m+2 (third third-Wednesday prompt) is the monthly prompt nearest the 3-month date"
  notes: >-
    Real substitution in cable, busbar, air-conditioning tubing and heat exchangers; the trade
    rule of thumb is that switching accelerates above 3.5 and the ratio has held near 4 since
    2024. Also a supply story: mine-constrained copper vs energy-constrained aluminium.

