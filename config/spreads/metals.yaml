    desk_convention: "HG in USD/lb divided by GC in USD/oz, unconverted (often x 1000). Ours converts gold to USD/lb, so it differs by the constant 14.5833 troy oz per lb; the log-ratio z-score is identical"
  notes: >-
    Growth vs fear. Tracked the US 10-year yield closely for a decade until 2022; the gap since
    (central-bank gold buying) is itself the signal. At record lows in 2025. The COMEX copper
    leg carries the US tariff premium from Feb 2025: use LME copper by hand to check a signal.

