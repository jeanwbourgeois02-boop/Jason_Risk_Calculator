# ---- precious ----
- id: bench.au.shfe_vs_comex
  family: benchmark
  name: SHFE gold vs COMEX gold (Shanghai premium)
  sector: metals
  legs:
    - {instrument: SHFE:AU,  weight: 1.0}
    - {instrument: COMEX:GC, weight: -1.0}
  unit: USD/oz
  fx: USDCNH
  tenor: main
  driver_tags: [gold_china_premium, fx_cnh]
  verified: false
  params:
    ratio_screen: true
    tenor_anchor: SHFE:AU      # COMEX lists every even month, so the same month always exists
    desk_convention: "quoted in USD/oz, or in CNY/g as SHFE minus COMEX x USDCNH / 31.1035"
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:AU
      offshore_leg: COMEX:GC
      freight_usd_t: 0
      other_usd_oz: 3                # air freight, insurance, refining to 1 kg 9999 bars
      import_duty: 0.0
      vat_rate: 0.0                  # exchange-traded standard gold is VAT-exempt
      formula: "parity_cny_g = (comex_usd_oz + other_usd_oz) * USDCNH / 31.1035; the window is only usable by banks holding a PBOC import licence and quota, so the premium can persist"
  notes: >-
    The paper version of the Shanghai gold premium (SGE spot is not a future). Positive when
    Chinese demand is strong and the PBOC withholds import quotas (2023: above 100 USD/oz);
    negative when demand is weak. It is also a CNH view: the PBOC has used quotas to manage
    the currency. CNY/g to USD/oz multiplies by 31.1035.

- id: bench.au.shfe_vs_ose
  family: benchmark
  name: SHFE gold vs OSE gold
  sector: metals
  legs:
    - {instrument: SHFE:AU, weight: 1.0}
    - {instrument: OSE:JAU, weight: -1.0}
  unit: USD/oz
  fx: [USDCNH, USDJPY]
  tenor: main
  driver_tags: [gold_china_premium, gold_location_arb, fx_cnh]
  verified: false
  params:
    ratio_screen: true
    tenor_anchor: SHFE:AU      # both list even months; without it OSE main is a year out and SHFE main about six months
    desk_convention: "ratio SHFE / OSE with both legs in USD/oz; CNY/g and JPY/g both x 31.1035"
  notes: >-
    Shanghai against Tokyo gold, both converted to USD/oz through the daily CNH and JPY
    rates, same delivery month on both legs through the anchor. Gold is VAT-exempt on
    SHFE and OSE quotes exclude consumption tax, so no vat_basis. It is the Shanghai
    premium seen from Asia rather than New York: Tokyo and Shanghai settle within an
    hour of each other, so the closes are nearly synchronous, unlike the COMEX pair.
    Added 2026-09-22 for the metals ratio screen.

