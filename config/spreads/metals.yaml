# Copied unchanged (apart from this header) on 2026-09-24 by the contract-master lane from the
# research app: Commodity Dashboard/rvapp/universe/spreads/metals.yaml. A template only: nothing in
# the app reads it yet (spreads-engine, Phase 3). Leg `instrument` values are contract roots
# (config/contracts.csv root_id).
# Non-ferrous metals spreads (base, precious, battery). Calendars come from calendar_rules.yaml.
# Destination: rvapp/universe/spreads/metals.yaml.
# Format: rvapp/universe/validate.py. `params` extensions are the ferrous ones (research/ferrous/NOTES.md):
#   vat_basis, tenor_anchor, arb_bound, conversion_cost(+_range), desk_convention.
#   One new arb_bound field: physical_premium_usd_t (CIF Shanghai / Yangshan premium; treat like other_usd_t).
# All of them are CONTEXT. The stored series is the straight paper spread (PLAN.md section 2, "Paper only").
# LME legs are the third-Wednesday monthly chain, never `tenor: main` on their own: see NOTES.md section 1.
# Nothing here has been reviewed by a human: verified is false everywhere.

# =====================================================================
# BENCHMARK - same metal, different venue, grade or location
# =====================================================================

# ---- copper ----
- id: bench.cu.shfe_vs_lme
  family: benchmark
  name: SHFE copper vs LME copper (import arb)
  sector: metals
  legs:
    - {instrument: SHFE:CU, weight: 1.0}
    - {instrument: LME:CA,  weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [cu_onshore_offshore, china_import_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: SHFE:CU      # LME leg = the third-Wednesday prompt of SHFE's main delivery month
    desk_convention: "quoted as the plain ratio SHFE / LME (hu-lun bi), VAT left in; break-even is about USDCNH x 1.13 plus premium, 8.0-8.3 at FX 7.1-7.3"
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:CU
      offshore_leg: LME:CA
      physical_premium_usd_t: 60     # Yangshan CIF premium; ranges 20-150
      import_duty: 0.0               # refined cathode, provisional rate; confidence: low
      vat_rate: 0.13
      port_charges_cny_t: 150        # port, customs, financing, delivery to warehouse
      formula: "parity_cny_t = (lme_usd_t + physical_premium_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when shfe_cny_t > parity_cny_t"
  notes: >-
    The core base-metal benchmark. China is a structural importer of cathode, so the spread
    lives just below import parity and opens in bursts that pull bonded stock onshore.
    SHFE expires on the 15th and the LME third Wednesday falls on the 15th-21st, so anchoring
    the LME leg to SHFE's main month compares the same delivery date; the rolling 3-month
    price would embed up to two months of LME backwardation. Settlements are 10 hours apart
    (15:00 Shanghai vs 17:00 London): read lead-lag correlations, not one-day moves.
    VAT was 17% to Apr-2018, 16% to Mar-2019, 13% since: ex_vat history needs the old rates.

- id: bench.cu.shfe_vs_comex
  family: benchmark
  name: SHFE copper vs COMEX copper
  sector: metals
  legs:
    - {instrument: SHFE:CU,  weight: 1.0}
    - {instrument: COMEX:HG, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [cu_onshore_offshore, us_copper_tariff]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: COMEX:HG     # HG trades H K N U Z; SHFE lists every month, so SHFE follows HG
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:CU
      offshore_leg: COMEX:HG
      physical_premium_usd_t: 60
      import_duty: 0.0
      vat_rate: 0.13
      port_charges_cny_t: 150
      formula: "as bench.cu.shfe_vs_lme with COMEX in USD/t (USD/lb x 2204.62). Not a physical arb in practice: US cathode does not flow to China"
  notes: >-
    Not a physical arb: it is bench.cu.shfe_vs_lme plus the COMEX-LME tariff spread. Kept because
    Shanghai night-session traders hedge on COMEX, and because in 2025 the US premium drained
    metal from China's supply chain, so this leg showed the stress first. Same-day comparison is
    cleaner than against the LME (the SHFE night session overlaps COMEX hours).

- id: bench.cu.comex_vs_lme
  family: benchmark
  name: COMEX copper vs LME copper (US tariff arb)
  sector: metals
  legs:
    - {instrument: COMEX:HG, weight: 1.0}
    - {instrument: LME:CA,   weight: -1.0}
  unit: USD/t
  tenor: main
  driver_tags: [us_copper_tariff, cu_venue_arb]
  verified: false
  params:
    tenor_anchor: COMEX:HG     # LME leg = third-Wednesday prompt of HG's main month
    desk_convention: "quoted in USD/t, or as a percentage of LME (the implied tariff probability x rate)"
    arb_bound:
      type: import_parity
      onshore_leg: COMEX:HG
      offshore_leg: LME:CA
      freight_usd_t: 100             # LME warehouse or Chile to US delivery points, incl. insurance and finance; 60-150
      import_duty: 0.0               # refined cathode was EXEMPTED from the 50% Section 232 copper tariff of 1 Aug 2025
      formula: "parity_usd_t = lme_usd_t * (1 + import_duty) + freight_usd_t; arb open when comex_usd_t > parity_usd_t"
  notes: >-
    The defining metals RV trade of 2025: the spread went from near zero to about 3000 USD/t
    (pricing a 50% tariff on cathode) and collapsed on 31 Jul 2025 when cathode was exempted.
    It still prices the proposed phased tariff on refined copper (15% from 2027, 30% from 2028
    in the Commerce recommendation; status confidence: low - check before trusting import_duty).
    Feb-Aug 2025 is a regime, not a distribution: z-scores whose window spans it mean little.
    COMEX delivers only US-located, mostly American-brand cathode, so the arb is one-way.

- id: bench.cu.shfe_vs_ine_bc
  family: benchmark
  name: SHFE copper vs INE bonded copper (VAT and bonded basis)
  sector: metals
  legs:
    - {instrument: SHFE:CU, weight: 1.0}
    - {instrument: INE:BC,  weight: -1.0}
  unit: CNY/t
  tenor: main
  driver_tags: [cu_onshore_offshore, china_import_arb, cu_bonded_basis]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: SHFE:CU      # same months, same expiry day
    desk_convention: "ratio CU / BC; pure tax would be 1.13"
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:CU
      offshore_leg: INE:BC
      import_duty: 0.0
      vat_rate: 0.13
      port_charges_cny_t: 150        # customs clearance and moving metal from bonded to domestic warehouse
      formula: "parity_cny_t = bc_cny_t * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; customs-clearing arb open when cu_cny_t > parity_cny_t"
  notes: >-
    Same metal, same city, same currency, same expiry: the spread is VAT (13%) plus the value of
    having cleared customs. No FX and no time-zone gap, so it is the cleanest read of the import
    window. CU / 1.13 - BC above clearing cost means bonded metal gets declared and the window
    is open. INE:BC is thin; expect stale settlements in back months.

- id: bench.cu.ine_bc_vs_lme
  family: benchmark
  name: INE bonded copper vs LME copper (implied Yangshan premium)
  sector: metals
  legs:
    - {instrument: INE:BC, weight: 1.0}
    - {instrument: LME:CA, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [cu_bonded_basis, cu_onshore_offshore]
  verified: false
  params:
    ratio_screen: true
    tenor_anchor: INE:BC
  notes: >-
    Both legs are tax-free, so the difference is the paper equivalent of the Yangshan CIF
    premium (metal in Shanghai bonded warehouse vs LME warrant) plus any CNH basis. Both legs
    are open to foreign traders, which makes it the only China copper basis an offshore account
    can trade directly. Typical range -50 to +150 USD/t. Noisy: BC is thin and the settlements
    are 10 hours apart.

# ---- aluminium ----
- id: bench.al.shfe_vs_lme
  family: benchmark
  name: SHFE aluminium vs LME aluminium
  sector: metals
  legs:
    - {instrument: SHFE:AL, weight: 1.0}
    - {instrument: LME:AH,  weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [al_onshore_offshore, china_import_arb, china_export_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: SHFE:AL
    desk_convention: "plain ratio SHFE / LME, VAT left in"
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:AL
      offshore_leg: LME:AH
      physical_premium_usd_t: 130    # CIF main Chinese ports; tracks the Japan premium
      import_duty: 0.0               # provisional rate on unwrought non-alloy aluminium; confidence: low
      vat_rate: 0.13
      port_charges_cny_t: 150
      export_tax: 0.15               # on primary ingot, which is why China exports semis, not metal
      export_vat_rebate: 0.0         # the 13% rebate on semis was removed on 1 Dec 2024
      formula: "parity_cny_t = (lme_usd_t + physical_premium_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when shfe_cny_t > parity_cny_t. Export side: semis leave when shfe_cny_t plus fabrication is below lme_usd_t * USDCNH with no rebate"
  notes: >-
    Two-sided band. China's 45 Mt capacity cap makes it a marginal importer (mostly Russian
    metal) when the ratio is high, and a semis exporter when it is low; removal of the semis
    rebate in Dec 2024 widened the band by about 13%. Stored series is the straight spread.

- id: bench.al.shfe_vs_comex
  family: benchmark
  name: SHFE aluminium vs COMEX aluminium
  sector: metals
  legs:
    - {instrument: SHFE:AL,   weight: 1.0}
    - {instrument: COMEX:ALI, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [al_onshore_offshore, al_venue_arb, us_aluminium_tariff]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: SHFE:AL      # COMEX lists every month, so the SHFE main month always exists
    desk_convention: "ratio SHFE / COMEX; not a physical arb, read it as bench.al.shfe_vs_lme plus the COMEX-LME basis"
  notes: >-
    Not a physical arb: US-delivered P1020A does not flow to China. It is
    bench.al.shfe_vs_lme plus the COMEX-LME basis, kept because the China list names
    COMEX ALI as a counterpart and because the COMEX leg may carry part of the Section 232
    Midwest premium (duty status not checked, confidence: low). COMEX:ALI is thin (a few
    thousand lots), so back-month settlements can be stale. Added 2026-09-22 for the
    metals ratio screen.

- id: bench.al.comex_vs_lme
  family: benchmark
  name: COMEX aluminium vs LME aluminium
  sector: metals
  legs:
    - {instrument: COMEX:ALI, weight: 1.0}
    - {instrument: LME:AH,    weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [al_venue_arb, us_aluminium_tariff]
  verified: false
  notes: >-
    Second-nearest month on both legs. COMEX delivers in US and other approved warehouses; how
    much of the 50% Section 232 tariff the contract prices depends on its duty status, which I
    have not checked (confidence: low). If it proves to sit flat to the LME it is a ticker
    sanity check; if it carries part of the Midwest premium it is a second tariff gauge.

- id: bench.al.mwp_vs_tariff_implied
  family: benchmark
  name: US Midwest premium vs half of LME aluminium (Section 232 pass-through)
  sector: metals
  legs:
    - {instrument: COMEX:AUP, weight: 1.0}
    - {instrument: LME:AH,    weight: -0.5}
  unit: USD/t
  tenor: m+1
  driver_tags: [us_aluminium_tariff, al_premium]
  verified: false
  params:
    desk_convention: "MWP in US cents per lb; full pass-through premium = tariff x (LME + logistics) + logistics"
    arb_bound:
      type: import_parity
      onshore_leg: COMEX:AUP
      offshore_leg: LME:AH
      import_duty: 0.5               # Section 232: 10% 2018, 25% from 12 Mar 2025, 50% from 4 Jun 2025
      freight_usd_t: 300             # pre-tariff logistics premium, Canada or Middle East to Midwest; 250-400
      formula: "full_pass_through_usd_t = import_duty * lme_usd_t + freight_usd_t; the stored value (MWP - 0.5 x LME) is the premium left after the tariff: near 300 means fully priced, well below means the market doubts the tariff or Canada gets a carve-out"
  notes: >-
    The weight of 0.5 is the tariff rate, so the row is only meaningful from 4 Jun 2025; before
    that read the ratio. If the rate changes, change the weight and add a level break. AUP is
    cash settled on the monthly average, so m+1 avoids the part-priced front month; the LME leg
    is the second third-Wednesday prompt.

- id: bench.al.mwp_vs_europe_dp
  family: benchmark
  name: US Midwest premium vs European duty-paid premium
  sector: metals
  legs:
    - {instrument: COMEX:AUP, weight: 1.0}
    - {instrument: COMEX:AEP, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [al_premium, us_aluminium_tariff]
  verified: false
  notes: >-
    Transatlantic premium spread: where the marginal tonne of Middle East and Indian metal goes.
    Dominated since 2025 by the US tariff; Europe adds CBAM cost from 2026 and the phase-out of
    Russian metal. AUP converts from USD/lb.

- id: bench.al.europe_dp_vs_du
  family: benchmark
  name: European aluminium premium, duty-paid vs duty-unpaid
  sector: metals
  legs:
    - {instrument: COMEX:AEP, weight: 1.0}
    - {instrument: COMEX:EDP, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [al_premium, eu_duty]
  verified: false
  notes: >-
    In theory the EU import duty (3% on unalloyed ingot) times the LME price, i.e. 70-90 USD/t;
    in practice it compresses when duty-free origins dominate supply. EDP is thin:
    confidence: low that it settles on real trades every day.

- id: bench.al.europe_du_vs_japan
  family: benchmark
  name: European duty-unpaid premium vs Japan premium (west-east)
  sector: metals
  legs:
    - {instrument: COMEX:EDP, weight: 1.0}
    - {instrument: COMEX:MJP, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [al_premium]
  verified: false
  notes: >-
    West vs East pull on Middle East and Australian metal. The Japan premium is negotiated
    quarterly, so the MJP leg steps. Both legs thin; lowest priority of the premium rows.

