- id: bench.alumina.shfe_vs_fob_aus
  family: benchmark
  name: SHFE alumina vs alumina FOB Australia
  sector: metals
  legs:
    - {instrument: SHFE:AO,   weight: 1.0}
    - {instrument: COMEX:ALA, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [alumina_onshore_offshore, china_import_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: SHFE:AO
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:AO
      offshore_leg: COMEX:ALA
      freight_usd_t: 30              # Western Australia to north China, Handysize/Supramax; 20-45
      import_duty: 0.0
      vat_rate: 0.13
      port_charges_cny_t: 40
      formula: "parity_cny_t = (fob_aus_usd_t + freight_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when shfe_cny_t > parity_cny_t"
  notes: >-
    China swings between alumina importer and exporter, so the spread crosses both parities: it
    exported through the late-2024 spike (FOB Australia above 800 USD/t) and the window flipped
    in 2025 as new Chinese and Indonesian refineries ramped. COMEX:ALA is thin; its settlement
    follows the Platts index with little independent trading. Freight and port: confidence: low.

