- id: sub.cn.alloy_vs_aluminium
  family: substitution
  name: SHFE cast alloy vs primary aluminium (secondary discount)
  sector: metals
  legs:
    - {instrument: SHFE:AD, weight: 1.0}
    - {instrument: SHFE:AL, weight: -1.0}
  unit: CNY/t
  tenor: main
  driver_tags: [al_alloy_chain, al_scrap_discount]
  verified: false
  params:
    desk_convention: "quoted as AD - AL in CNY/t, normally negative"
  notes: >-
    The liquid way to trade scrap tightness: die casters switch between ADC12 and primary-based
    alloy. Typically -300 to -1500 CNY/t; narrows when scrap is short (the US and EU keeping
    scrap at home) and in the autumn auto peak. History from June 2025.

- id: sub.cn.nickel_vs_stainless
  family: substitution
  name: Nickel / stainless ratio (SHFE)
  sector: metals
  legs:
    - {instrument: SHFE:NI, weight: 1.0}
    - {instrument: SHFE:SS, weight: -1.0}
  unit: CNY/t
  tenor: main
  driver_tags: [stainless_nickel]
  verified: false
  params:
    desk_convention: "the ratio NI / SS (about 9-10). Ferrous owns the margin form, proc.cn.stainless_vs_nickel = SS - 0.08 x NI"
  notes: >-
    External leg: SHFE:SS (ferrous). Same two instruments as the ferrous margin row; kept here
    because the nickel desk quotes the ratio. Refined nickel is no longer what stainless mills
    buy (they buy NPI at a moving discount), so a falling ratio means Indonesian NPI and
    converted cathode are cheapening nickel units faster than stainless. If the housekeeper
    wants one row per pair, keep the ferrous one and drop this.

# ---- battery ----
- id: sub.li.hydroxide_vs_carbonate
  family: substitution
  name: Lithium hydroxide vs carbonate (CME, CIF CJK)
  sector: metals
  legs:
    - {instrument: COMEX:LTH, weight: 1.0}
    - {instrument: COMEX:LTC, weight: -1.0}
  unit: USD/kg
  tenor: m+1
  driver_tags: [lithium_chain, cathode_chemistry]
  verified: false
  params:
    conversion_cost: 1.0
    conversion_cost_range: [0.6, 1.5]
    desk_convention: "quoted as hydroxide minus carbonate in USD/kg"
  notes: >-
    Hydroxide feeds high-nickel NMC cathodes, carbonate feeds LFP. LFP's rise to over 70% of
    Chinese cells turned the hydroxide premium (5+ USD/kg in 2022) into a discount at times.
    Carbonate can be causticised into hydroxide for about 1 USD/kg, which caps the premium:
    that is the conversion_cost here. Same index provider and location on both legs.

