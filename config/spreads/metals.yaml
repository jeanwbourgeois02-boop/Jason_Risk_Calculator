# ---- lithium ----
- id: bench.li.gfex_vs_cme_carbonate
  family: benchmark
  name: GFEX lithium carbonate vs CME lithium carbonate CIF CJK
  sector: metals
  legs:
    - {instrument: GFEX:LC,   weight: 1.0}
    - {instrument: COMEX:LTC, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [lithium_onshore_offshore, china_import_arb, lithium_chain]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: GFEX:LC
    arb_bound:
      type: import_parity
      onshore_leg: GFEX:LC
      offshore_leg: COMEX:LTC
      freight_usd_t: 0               # the index is already CIF China, Japan, Korea
      import_duty: 0.0               # Chile and Australia under FTAs; MFN 5%. Argentina pays MFN: confidence: low
      vat_rate: 0.13
      port_charges_cny_t: 500
      formula: "parity_cny_t = cif_usd_kg * 1000 * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t"
  notes: >-
    GFEX is where lithium is priced: open interest is tens of times CME's, and the Fastmarkets
    CIF CJK index behind the CME leg lags Chinese spot by one to three weeks. So the spread is
    a lead-lag trade as much as an arb: GFEX moves first, CME converges. CME quotes USD/kg,
    converted to USD/t by the engine. COMEX:LTC is thin; settlements are broker curves.

