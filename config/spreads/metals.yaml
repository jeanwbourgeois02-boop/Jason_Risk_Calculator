- id: proc.cn.aluminium_smelter
  family: processing
  name: China aluminium smelter margin (SHFE aluminium minus alumina)
  sector: metals
  legs:
    - {instrument: SHFE:AL, weight: 1.0}
    - {instrument: SHFE:AO, weight: -1.92}
  unit: CNY/t
  tenor: main
  driver_tags: [al_smelter_margin, alumina_chain]
  verified: false
  params:
    tenor_anchor: SHFE:AO      # AL lists every month with open interest along the curve; AO is 1/5/9
    conversion_cost: 10000
    conversion_cost_range: [9000, 11500]
    desk_convention: "also watched as the price ratio AO / AL: alumina at 17-19% of the metal price is normal, above 25% is a squeeze (late 2024)"
  notes: >-
    1.92 t alumina per tonne of metal. The rest of the cost has no future: power about 13500 kWh
    (5500-6000 CNY), carbon anode 0.46 t (about 2300), fluorides, labour, depreciation (about
    2000): hence conversion_cost 10000, left out of `constant` as in ferrous. Both legs include
    13% VAT, which cancels. With output capped at 45 Mt the metal price cannot be arbitraged
    down by new capacity, so the margin is driven by the alumina leg.

- id: proc.global.aluminium_smelter
  family: processing
  name: Western aluminium smelter margin (LME aluminium minus alumina FOB Australia)
  sector: metals
  legs:
    - {instrument: LME:AH,    weight: 1.0}
    - {instrument: COMEX:ALA, weight: -1.92}
  unit: USD/t
  tenor: m+1
  driver_tags: [al_smelter_margin, alumina_chain]
  verified: false
  params:
    conversion_cost: 1100
    conversion_cost_range: [900, 1400]
    desk_convention: "alumina price as a percentage of LME (the linkage rate of legacy contracts, 13-16%); index-priced alumina broke away from it after 2010"
  notes: >-
    Excludes the regional premium, which the smelter also earns: add COMEX:AUP or COMEX:AEP by
    hand for a US or European smelter. conversion_cost (power 14 MWh at about 40 USD, carbon,
    other) is confidence: low. COMEX:ALA is thin.

- id: proc.cn.adc12_primary_blend
  family: processing
  name: SHFE cast alloy minus primary-metal blend cost (ADC12 ceiling)
  sector: metals
  legs:
    - {instrument: SHFE:AD, weight: 1.0}
    - {instrument: SHFE:AL, weight: -0.865}
    - {instrument: GFEX:SI, weight: -0.11}
    - {instrument: SHFE:CU, weight: -0.025}
  unit: CNY/t
  tenor: main
  driver_tags: [al_alloy_chain, al_scrap_discount]
  verified: false
  params:
    conversion_cost: 600
    conversion_cost_range: [400, 900]
  notes: >-
    ADC12 is about 10.5-11% silicon and 1.5-3.5% copper, the rest aluminium. It is normally
    made from scrap, so the alloy trades BELOW this primary blend and the value is negative;
    the blend cost is the ceiling (above it, alloy can be made from primary metal). How far
    below measures scrap availability. Weights are mid-spec: confidence: medium. History from
    June 2025 only.

- id: proc.cn.polysilicon_vs_silicon
  family: processing
  name: GFEX polysilicon minus silicon metal
  sector: metals
  legs:
    - {instrument: GFEX:PS, weight: 1.0}
    - {instrument: GFEX:SI, weight: -1.1}
  unit: CNY/t
  tenor: main
  driver_tags: [solar_chain]
  verified: false
  params:
    conversion_cost: 28000
    conversion_cost_range: [24000, 34000]
  notes: >-
    About 1.1 t of silicon metal powder per tonne of polysilicon, but silicon is only a quarter
    of cash cost; power (55-60 MWh per tonne) dominates and has no future. So this is a
    relative-value signal along the solar chain rather than a margin. Since mid-2025 the
    polysilicon leg is driven by the anti-involution capacity buy-out plan, not by cost.
    conversion_cost is confidence: low. History from Dec 2024; GFEX:SI has a grade break at
    the SI2412 contract.

- id: proc.li.carbonate_vs_spodumene
  family: processing
  name: Lithium converter margin (GFEX carbonate minus CME spodumene)
  sector: metals
  legs:
    - {instrument: GFEX:LC,   weight: 1.0}
    - {instrument: COMEX:SPO, weight: -8.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [lithium_chain, lithium_converter_margin]
  verified: false
  params:
    vat_basis: ex_vat
    conversion_cost: 2800
    conversion_cost_range: [2200, 3500]
  notes: >-
    About 8 t of 6% spodumene concentrate per tonne of carbonate (7.8-8.2 at typical recovery).
    Chinese converters buy CIF China concentrate and sell at GFEX-linked prices, so this is
    their real margin; it has been near or below zero for most of 2024-25. The stored series
    keeps VAT inside the GFEX leg: read it with vat_basis. COMEX:SPO is marked illiquid, so no
    data until that status changes. confidence: low on the spodumene leg throughout.

- id: proc.li.cme_carbonate_vs_spodumene
  family: processing
  name: Lithium converter margin, all CME (carbonate CIF CJK minus spodumene)
  sector: metals
  legs:
    - {instrument: COMEX:LTC, weight: 1.0}
    - {instrument: COMEX:SPO, weight: -8.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [lithium_chain, lithium_converter_margin]
  verified: false
  params:
    conversion_cost: 2800
    conversion_cost_range: [2200, 3500]
  notes: >-
    Same margin with no VAT or FX in it, both legs Fastmarkets indices in USD. Both legs thin;
    no data while COMEX:SPO is illiquid.

