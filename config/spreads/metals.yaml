  fx: USDCNH
  tenor: main
  driver_tags: [silver_china_premium, china_export_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    desk_convention: "SHFE in CNY/kg / 1.13 / USDCNH / 32.1507 minus COMEX"
    arb_bound:
      type: import_parity
      onshore_leg: SHFE:AG
      offshore_leg: COMEX:SI
      import_duty: 0.0
      vat_rate: 0.13
      other_usd_oz: 0.3
      export_vat_rebate: 0.0
      formula: "parity_cny_kg = (comex_usd_oz + other_usd_oz) * 32.1507 * USDCNH * (1 + vat_rate). China is normally a net silver exporter, so the ex-VAT spread sits at or below zero; exports need a licence"
  notes: >-
    No tenor_anchor: SHFE's main months are even, COMEX's are H K N U Z, and COMEX lists other
    months only when they are nearby. Main vs main is what is traded; it embeds 0-3 months of
    contango (about 0.4% a month). The stored series has 13% VAT inside the SHFE leg, so its
    level is about 11% of price above the economic premium: trust the ratio z-score, not the
    level. CNY/kg to USD/oz divides by 32.1507; the legacy dashboard used 31.1035 and was 3.4%
    out (PLAN.md section 10), so do not expect the two to match.

