# =====================================================================
# PROCESSING - power generation and gas processing
# =====================================================================

- id: proc.eu.clean_spark_de
  family: processing
  name: German clean spark spread (base power, TTF, EUA)
  sector: energy
  legs:
    - {instrument: EEX:DEBM, weight: 1.0}
    - {instrument: ICE:TFM,  weight: -2.0354}
    - {instrument: ICE:ECF,  weight: -1.0, qty_factor: 2.6695}
  unit: EUR/mwh
  fx: null
  tenor: front
  driver_tags: [europe_power_margin, gas_coal_switching]
  verified: false
  params:
    tenor_anchor: ICE:TFM        # TTF front = month ahead; power follows it; EUA falls back to the next December (NOTES.md, engine requirements)
    conversion_cost: 3.0
    conversion_cost_range: [2.0, 4.0]
  notes: >-
    Power - gas / 0.4913 - EUA x 0.3746. Heat rate: a CCGT at 49.13% HHV efficiency burns
    1 / 0.4913 = 2.0354 MWh of gas per MWh of power. Carbon: 0.18404 t CO2 per MWh of gas
    / 0.4913 = 0.3746 t per MWh of power, so qty_factor = 1 / 0.3746 = 2.6695 MWh of power
    per tonne of CO2. These are the standard published clean-spark parameters; modern
    plants reach 55-60% LHV. TTF stands in for the German THE hub (basis under 1 EUR/MWh).

- id: proc.eu.clean_dark_de
  family: processing
  name: German clean dark spread (base power, API 2, EUA)
  sector: energy
  legs:
    - {instrument: EEX:DEBM, weight: 1.0}
    - {instrument: ICE:ATW,  weight: -2.857143, qty_factor: 6.978}
    - {instrument: ICE:ECF,  weight: -1.0, qty_factor: 1.0277}
  unit: EUR/mwh
  fx: USDEUR
  tenor: m+1
  driver_tags: [europe_power_margin, gas_coal_switching]
  verified: false
  params:
    tenor_anchor: ICE:ATW        # API 2 m+1 = month ahead (its current month stays listed); power follows; EUA = next December
    conversion_cost: 4.0
    conversion_cost_range: [3.0, 6.0]
  notes: >-
    Power - coal / 6.978 / 0.35 - EUA x 0.973. Coal: 6,000 kcal/kg NAR = 6.978 MWh per tonne
    (qty_factor), and a 35% efficient plant burns 1 / 0.35 = 2.8571 MWh of coal per MWh of
    power. Carbon: 0.34056 t CO2 per MWh of coal / 0.35 = 0.973 t per MWh of power, so
    qty_factor = 1 / 0.973 = 1.0277. API 2 is USD/t: FX to EUR. Excludes about 5 EUR/t of
    Rhine barge freight to the plant.

- id: proc.us.spark_pjm
  family: processing
  name: PJM West spark spread (peak power vs Henry Hub, 7 heat rate)
  sector: energy
  legs:
    - {instrument: NYMEX:JM, weight: 1.0}
    - {instrument: NYMEX:NG, weight: -2.0516}
  unit: USD/mwh
  tenor: main
  driver_tags: [us_power_margin]
  verified: false
  params:
    tenor_anchor: NYMEX:NG
    desk_convention: "power - 7.0 x gas, heat rate 7 mmBtu/MWh"
    conversion_cost: 3.0
  notes: >-
    Heat rate 7 mmBtu per MWh. The engine converts NG to USD/MWh thermal by x 3.412
    mmBtu/MWh (same dimension), so weight = 7 / 3.412 = 2.0516 (an efficiency of 48.7%).
    Henry Hub stands in for the plant's delivered gas (Tetco M3 or Dominion South trade as
    basis swaps, not expressible here), so winter values overstate the margin. No carbon
    cost outside RGGI states. confidence: low on the power leg's code and liquidity.

- id: proc.us.propane_frac_spread
  family: processing
  name: US propane frac spread (Mont Belvieu propane vs Henry Hub)
  sector: energy
  legs:
    - {instrument: NYMEX:B0, weight: 1.0, qty_factor: 0.091502}
    - {instrument: NYMEX:NG, weight: -1.0}
  unit: USD/mmbtu
  tenor: main
  driver_tags: [ngl_frac_spread, us_gas_processing]
  verified: false
  params:
    tenor_anchor: NYMEX:NG
  notes: >-
    Value of propane extracted from the gas stream against leaving it in as methane.
    qty_factor 0.091502 mmBtu per gal (propane 91,502 Btu/gal), so USD/gal / 0.091502 =
    USD/mmBtu. Processors reject ethane and, in extremis, propane when this nears zero.

