    = USD/t. The most important LPG spread: the US is the marginal supplier. It pays the
    terminal fee (5-10 c/gal) plus VLGC freight via Panama (80-250 USD/t); both are
    confidence: low and very volatile. Both legs are monthly-average swaps: m+1.

