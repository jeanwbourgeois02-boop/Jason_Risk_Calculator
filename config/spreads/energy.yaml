- id: bench.crude.wti_houston_vs_cushing
  family: benchmark
  name: ICE Midland WTI (Houston) vs NYMEX WTI (Cushing)
  sector: energy
  legs:
    - {instrument: ICE:HOU,  weight: 1.0}
