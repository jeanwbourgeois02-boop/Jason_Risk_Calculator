- id: bench.lpg.dce_pg_vs_afei
  family: benchmark
  name: DCE LPG vs Argus Far East propane (AFEI)
  sector: energy
  legs:
    - {instrument: DCE:PG,   weight: 1.0}
    - {instrument: NYMEX:7E, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [china_lpg_arb, china_import_arb]
  verified: false
  params:
    vat_basis: ex_vat            # DCE price / 1.09 before FX; AFEI carries no VAT
    tenor_anchor: DCE:PG
    arb_bound:
      type: import_parity
      onshore_leg: DCE:PG
      offshore_leg: NYMEX:7E
      freight_usd_t: 0           # AFEI is already CFR Far East
      import_duty: 0.01          # MFN 1%; US-origin cargoes carry an extra retaliatory tariff, check
      vat_rate: 0.09
      port_charges_cny_t: 150    # terminal, storage, delivery-point discount; confidence: low
      formula: "parity_cny_t = afei_usd_t * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when pg_cny_t > parity_cny_t"
  notes: >-
    Import parity for Chinese propane. PG delivers the cheapest of propane, butane or mix at
    the cheapest delivery point, so it sits below parity out of season and squeezes above
    it into winter delivery months. The stored paper spread keeps VAT in; vat_basis is
    context for the parity line.

- id: bench.lpg.dce_pg_vs_cp
  family: benchmark
  name: DCE LPG vs Saudi CP propane
  sector: energy
  legs:
    - {instrument: DCE:PG,   weight: 1.0}
    - {instrument: NYMEX:9N, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [china_lpg_arb, china_import_arb]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: DCE:PG
    arb_bound:
      type: import_parity
      onshore_leg: DCE:PG
      offshore_leg: NYMEX:9N
      freight_usd_t: 70          # Gulf to South China VLGC, 40-120
      import_duty: 0.01
      vat_rate: 0.09
      port_charges_cny_t: 150
      formula: "parity_cny_t = (cp_usd_t + freight_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t"
  notes: >-
    Chinese importers price term cargoes off CP, so this is the spread domestic desks
    quote. It embeds VLGC freight; use the AFEI row for a freight-free read.

- id: bench.lpg.afei_vs_cp
  family: benchmark
  name: AFEI propane vs Saudi CP propane
  sector: energy
  legs:
    - {instrument: NYMEX:7E, weight: 1.0}
    - {instrument: NYMEX:9N, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [lpg_freight, lpg_east_west]
  verified: false
  notes: >-
    CFR Far East minus FOB Gulf: a paper proxy for VLGC freight Gulf to Japan plus Asian
    demand pull. CP is one number fixed for the month, so after the announcement the CP
