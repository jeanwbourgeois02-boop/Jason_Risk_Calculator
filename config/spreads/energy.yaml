# Copied unchanged (apart from this header) on 2026-09-24 by the contract-master lane from the
# research app: Commodity Dashboard/rvapp/universe/spreads/energy.yaml. A template only: nothing in
# the app reads it yet (spreads-engine, Phase 3). Leg `instrument` values are contract roots
# (config/contracts.csv root_id).
# Energy spreads. One entry per spread; calendars come from calendar_rules.yaml.
# Destination: rvapp/universe/spreads/energy.yaml.
# Format: rvapp/universe/validate.py. Extensions are defined in NOTES.md:
#   leg key  qty_factor  (cross-dimension legs: spread-quantity units per one leg-quantity unit;
#                          price per spread unit = leg price / qty_factor)
#   params   tenor_anchor, arb_bound (types import_parity and location_arb), vat_basis,
#            conversion_cost(+_range), desk_convention.
# Every stored series is the straight paper spread. Freight, tolls, tax and opex sit in params
# as context and are never subtracted. Nothing here has been reviewed by a human.
#
# Tenor rules used throughout:
#   - futures vs futures with different expiry calendars: tenor main + tenor_anchor on the leg
#     that expires FIRST, so the same delivery month exists on every other leg.
#   - monthly-average swap vs swap: m+1 on both (generic 1 is the part-priced current month).
#   - European gas, power, coal: open interest cascades from year and quarter contracts, so
#     `main` does not identify a month. Those rows use front or m+1, and where they carry a
#     tenor_anchor the anchor leg resolves by the row's own tenor (engine requirement, NOTES.md).
# Standard conversions: 42 gal/bbl; gasoil 7.45, gasoline 8.33, naphtha 8.9, fuel oil 6.35 bbl/t;
#   propane 521 gal/t; crude 5.8 mmBtu/bbl and 7.33 bbl/t; coal 6,000 kcal/kg = 6.978 MWh/t
#   = 23.81 mmBtu/t; 1 MWh = 3.412 mmBtu.

# =====================================================================
# BENCHMARK - crude
# =====================================================================

- id: bench.crude.brent_vs_wti
  family: benchmark
  name: Brent vs WTI
  sector: energy
  legs:
    - {instrument: ICE:B,    weight: 1.0}
    - {instrument: NYMEX:CL, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [crude_atlantic_arb, us_crude_exports]
  verified: false
  params:
    tenor_anchor: ICE:B        # Brent M expires end of M-2, WTI M about the 20th of M-1
    arb_bound:
      type: location_arb
      from_leg: NYMEX:CL
      to_leg: ICE:B
      cost_items: {pipeline_cushing_to_gulf: 1.0, terminal_and_loading: 0.5, freight_usgc_to_rotterdam: 2.5}
      total_cost: 4.0
      formula: "US export arb to Europe is open when brent - wti > total_cost (USD/bbl)"
  notes: >-
    The transatlantic arb. Same delivery month on both legs (front-vs-front mixes months for
    three weeks out of four). WTI Midland has been in the Dated Brent basket since 2023, so
    the spread is anchored near export cost, 3-5 USD/bbl; it blows out on Cushing or Gulf
    Coast congestion and narrows when US exports must be shut in. Cost numbers are desk
    estimates, confidence: low.

- id: bench.crude.brent_vs_dubai
  family: benchmark
  name: Brent futures vs Dubai swap (EFS)
  sector: energy
  legs:
    - {instrument: ICE:B,    weight: 1.0}
    - {instrument: NYMEX:DC, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [crude_sweet_sour, crude_east_west, opec_supply]
  verified: false
  params:
    tenor_anchor: ICE:B
    desk_convention: "EFS for month M = Brent futures M minus Dubai swap M"
  notes: >-
    The Brent-Dubai exchange of futures for swaps, quoted exactly this way. Wide EFS makes
    Atlantic basin crude expensive in Asia and pulls Asian buyers to Gulf sour grades;
    narrow or negative EFS (OPEC+ cuts fall on sour barrels) opens the west-to-east arb.
    Also the cleanest sweet-sour gauge on paper.

- id: bench.crude.sc_vs_brent
  family: benchmark
  name: INE SC vs Brent
  sector: energy
  legs:
    - {instrument: INE:SC, weight: 1.0}
    - {instrument: ICE:B,  weight: -1.0}
  unit: USD/bbl
  fx: USDCNH
  tenor: main
  driver_tags: [china_crude_arb, china_import_arb, crude_east_west]
  verified: false
  params:
    desk_convention: "SC main minus Brent main, each leg on its own main contract"
    arb_bound:
      type: import_parity
      onshore_leg: INE:SC
      offshore_leg: ICE:B
      freight_usd_bbl: 2.0       # Gulf to China VLCC, 1.5-3.0; spikes with tanker rates
      other_usd_bbl: 0.7         # insurance, port, bonded storage, financing
      import_duty: 0.0           # bonded delivery
      vat_rate: 0.0
      formula: "parity = delivered-grade FOB (about Dubai/Oman) + freight + other; SC rich when sc_usd > parity"
  notes: >-
    No tenor_anchor on purpose: Brent month M expires a month before SC month M, so the
    same month is missing on Brent for about ten trading days in every cycle. Main vs main
    embeds one month of Brent curve (usually under 1 USD/bbl). SC is bonded, ex duty and
    VAT. It settles at 15:00 Shanghai, Brent's settlement is London evening: use the same
    snapshot where possible or expect noise of a day's move. Drivers: tanker freight,
    INE warehouse receipts, CNH, Chinese import quotas.

- id: bench.crude.sc_vs_oman
  family: benchmark
  name: INE SC vs GME Oman
  sector: energy
  legs:
    - {instrument: INE:SC,  weight: 1.0}
    - {instrument: GME:OQD, weight: -1.0}
  unit: USD/bbl
  fx: USDCNH
  tenor: main
  driver_tags: [china_crude_arb, china_import_arb]
  verified: false
  params:
    arb_bound:
      type: import_parity
      onshore_leg: INE:SC
      offshore_leg: GME:OQD
      freight_usd_bbl: 2.0
      other_usd_bbl: 0.7
      import_duty: 0.0
      vat_rate: 0.0
      formula: "parity = oman_fob + freight + other; delivery into INE pays when sc_usd > parity"
  notes: >-
    The true physical arb: Oman is deliverable into SC at par and both are medium sour.
    Main vs main for the reason given on bench.crude.sc_vs_brent (Oman also expires end of
    M-2). Oman futures liquidity is concentrated in the Singapore 16:30 settlement window.

- id: bench.crude.sc_vs_dubai
  family: benchmark
  name: INE SC vs Dubai swap
  sector: energy
  legs:
    - {instrument: INE:SC,   weight: 1.0}
    - {instrument: NYMEX:DC, weight: -1.0}
  unit: USD/bbl
  fx: USDCNH
  tenor: main
  driver_tags: [china_crude_arb, china_import_arb]
  verified: false
  params:
    tenor_anchor: INE:SC       # the swap for the same month is always listed and not yet pricing
  notes: >-
    Same idea as SC vs Oman on the more liquid sour marker, and the only SC benchmark row
    with a clean same-month match.

- id: bench.crude.sc_vs_wti
  family: benchmark
  name: INE SC vs WTI
  sector: energy
  legs:
    - {instrument: INE:SC,   weight: 1.0}
