  name: RBOB vs Eurobob gasoline (transatlantic gasoline arb)
  sector: energy
  legs:
    - {instrument: NYMEX:RB, weight: 1.0}
    - {instrument: NYMEX:7H, weight: -1.0, qty_factor: 8.33}
  unit: USD/bbl
  tenor: main
  driver_tags: [gasoline_atlantic_arb]
  verified: false
  params:
    tenor_anchor: NYMEX:RB
    desk_convention: "quoted in US cents per gallon: divide by 0.42"
    arb_bound:
      type: location_arb
      from_leg: NYMEX:7H
      to_leg: NYMEX:RB
      cost_items: {freight_ara_to_nyh: 3.0, rvo_and_blending: 3.0}
      total_cost: 6.0
      formula: "Europe-to-New-York gasoline arb open when rbob - eurobob > total_cost (USD/bbl)"
  notes: >-
    Eurobob USD/t divided by 8.33 bbl/t. Europe's gasoline surplus clears into the US East
    Coast, so this sits near freight plus blending and RIN cost and widens into driving
    season. RBOB's April grade change (summer RVP) lifts it by several USD/bbl: seasonal,
    not a signal. Cost numbers confidence: low.

