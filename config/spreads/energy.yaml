      type: location_arb
      from_leg: ICE:TFM
      to_leg: ICE:JKM
      cost_items: {extra_shipping_usgc_to_asia_vs_europe: 1.3}
      total_cost: 1.3
      formula: "US cargoes point to Asia when jkm - ttf > extra shipping cost (USD/mmBtu), to Europe below it"
  notes: >-
    Which basin wins the marginal LNG cargo. TTF is EUR/MWh: divided by 3.412 mmBtu/MWh
    (same dimension, engine converts) and by EURUSD. Since 2022 Europe is the sink, so the
    spread has lived near or below the freight differential. Shipping number moves 0.5-3.0
    with charter rates and Panama or Suez routing; confidence: low.

