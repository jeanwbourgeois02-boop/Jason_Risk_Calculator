  fx: USDCNH
  tenor: main
  driver_tags: [china_crude_arb, us_crude_exports]
  verified: false
  notes: >-
    Main vs main. Widest of the SC spreads because it stacks sweet-sour, Brent-WTI and the
    long-haul freight from the US Gulf (5-8 USD/bbl VLCC, confidence: low). Popular with
    Chinese retail and CTA flow because both legs are liquid in Asian hours.

- id: bench.crude.oman_vs_dubai
  family: benchmark
  name: GME Oman vs Dubai swap
  sector: energy
  legs:
    - {instrument: GME:OQD,  weight: 1.0}
    - {instrument: NYMEX:DC, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [crude_gulf_sour]
  verified: false
  params:
    tenor_anchor: GME:OQD
  notes: >-
    Two Gulf sour markers that set most Asian term prices (Saudi, Kuwait: average of Oman
    and Dubai). Normally within 1 USD/bbl; moves on Chinese buying of Oman and on Platts
    window play in Dubai partials. Same month label on both legs; confidence: low on
    whether desks lag the swap by two months instead.

