- id: sub.lpg.afei_vs_mopj
  family: substitution
  name: Propane vs naphtha, Asia (AFEI vs MOPJ)
  sector: energy
  legs:
    - {instrument: NYMEX:7E, weight: 1.0}
    - {instrument: NYMEX:JA, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [propane_naphtha_switch, asia_petchem_demand]
  verified: false
  params:
    desk_convention: "also watched as a ratio: crackers switch to propane below about 90-95% of naphtha, i.e. a spread under roughly -50 USD/t"
  notes: >-
    Flexible steam crackers in Korea, Japan and China swap up to 10-15% of naphtha feed for
    propane when it is cheap enough. Summer spreads go deeply negative (propane glut),
    winter ones positive (heating demand). Mean-reverting with a hard economic trigger.

- id: sub.lpg.ara_propane_vs_nwe_naphtha
  family: substitution
  name: Propane vs naphtha, Europe (CIF ARA propane vs NWE naphtha)
  sector: energy
  legs:
    - {instrument: NYMEX:PS, weight: 1.0}
    - {instrument: NYMEX:UN, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [propane_naphtha_switch, petchem_demand]
  verified: false
  notes: "European version; crackers there have more LPG flexibility, so the trigger is nearer -30 USD/t. confidence: low on the trigger."

- id: sub.lpg.mont_belvieu_vs_wti
  family: substitution
  name: Mont Belvieu propane vs WTI (propane-crude)
  sector: energy
  legs:
    - {instrument: NYMEX:B0, weight: 1.0}
    - {instrument: NYMEX:CL, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [propane_crude_ratio, us_ngl_supply]
  verified: false
  params:
    tenor_anchor: NYMEX:CL
    desk_convention: "quoted as a percentage: propane x 42 / WTI; this row's ratio. 35-70% is the usual range"
  notes: >-
    Propane USD/gal x 42 against WTI, both volume, engine converts. Low ratios mean US
    inventories are heavy (associated-gas NGL supply outruns exports and heating demand).
    Watch the ratio, not the difference.

- id: sub.lpg.dce_pg_vs_sc
  family: substitution
  name: DCE LPG vs INE SC (China propane-crude)
  sector: energy
  legs:
    - {instrument: DCE:PG, weight: 1.0}
    - {instrument: INE:SC, weight: -1.0, qty_factor: 0.13643}
  unit: CNY/t
  fx: null
  tenor: main
  driver_tags: [propane_crude_ratio, china_lpg_arb]
  verified: false
  notes: >-
    Tonne against tonne: SC CNY/bbl / 0.13643 t per bbl (= x 7.33 bbl/t). PG includes 9%
    VAT, SC is bonded, so watch the ratio. Chinese desks trade it as the oil-to-LPG
    relative value; CP is set with reference to crude so the link is real but loose.
    confidence: low on the 7.33 convention.

- id: sub.sg.jet_vs_gasoil
  family: substitution
  name: Singapore jet vs gasoil (regrade)
  sector: energy
  legs:
    - {instrument: NYMEX:KS, weight: 1.0}
    - {instrument: NYMEX:SG, weight: -1.0}
  unit: USD/bbl
  tenor: m+1
  driver_tags: [regrade, aviation_demand]
  verified: false
  notes: >-
    Refiners swing a few percent of yield between jet and diesel, which bounds the regrade
    to roughly -4 to +4 USD/bbl. Negative means aviation is the weak link (2020-22);
    positive in cold Northeast Asian winters.

- id: sub.us.ho_vs_rbob
  family: substitution
  name: Heating oil vs RBOB (distillate vs gasoline)
  sector: energy
  legs:
    - {instrument: NYMEX:HO, weight: 1.0}
    - {instrument: NYMEX:RB, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [diesel_gasoline_spread]
  verified: false
  params:
    tenor_anchor: NYMEX:RB
    desk_convention: "quoted in US cents per gallon: divide by 0.42"
  notes: >-
    Refinery yield switch between max-distillate and max-gasoline mode. Seasonal: distillate
    rich in winter, gasoline rich in spring. The industrial economy against the consumer.

- id: sub.eu.eurobob_vs_naphtha
  family: substitution
  name: Eurobob gasoline vs NWE naphtha (gas-nap)
  sector: energy
  legs:
    - {instrument: NYMEX:7H, weight: 1.0}
    - {instrument: NYMEX:UN, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [gasoline_blending, reforming_margin]
  verified: false
  notes: >-
    Naphtha goes either to the gasoline pool (via reformers and direct blending) or to
    crackers. A wide gas-nap pulls naphtha into gasoline and tightens petrochemical feed.
    Typical 50-200 USD/t, widest in summer.

- id: sub.sg.vlsfo_vs_gasoil
  family: substitution
  name: Singapore 0.5% marine fuel vs Singapore gasoil
  sector: energy
  legs:
    - {instrument: NYMEX:S5F, weight: 1.0}
    - {instrument: NYMEX:SG,  weight: -1.0, qty_factor: 0.13423}
  unit: USD/t
  tenor: m+1
  driver_tags: [bunker_demand, distillate_crack]
  verified: false
  notes: >-
    qty_factor 0.13423 t per bbl = 1 / 7.45, so gasoil becomes USD/t. VLSFO is blended from
    vacuum gasoil and low-sulphur residue that could otherwise go to diesel, and ships can
    burn marine gasoil instead: gasoil caps VLSFO. Usually -100 to -250 USD/t.

- id: sub.cn.bu_vs_fu
  family: substitution
  name: SHFE bitumen vs SHFE fuel oil
  sector: energy
  legs:
    - {instrument: SHFE:BU, weight: 1.0}
    - {instrument: SHFE:FU, weight: -1.0}
  unit: CNY/t
  fx: null
  tenor: main
  driver_tags: [china_heavy_products, china_infrastructure]
  verified: false
  notes: >-
    Two outlets for the bottom of the barrel: Chinese refiners shift heavy residue between
    bitumen and coker or bunker feed. BU is domestic with 13% VAT, FU is bonded without, so
    the level is not an arb; a popular onshore pair because both trade on SHFE. Each leg on
    its own main contract.

- id: sub.eu.gas_vs_coal_power
  family: substitution
  name: European gas vs coal for power (fuel cost per MWh of electricity)
  sector: energy
  legs:
    - {instrument: ICE:TFM, weight: 2.0354}
    - {instrument: ICE:ATW, weight: -2.857143, qty_factor: 6.978}
  unit: EUR/mwh
  fx: USDEUR
  tenor: front
  driver_tags: [gas_coal_switching, europe_power_margin]
  verified: false
  params:
    tenor_anchor: ICE:TFM        # month ahead on both legs
    desk_convention: "equals dark spread minus spark spread before carbon. With carbon, gas wins when this value < EUA x (0.973 - 0.3746) = EUA x 0.598"
  notes: >-
    Gas-coal switching, the two-leg version: TTF / 0.4913 minus API 2 / 6.978 MWh per t /
    0.35. A substitution row takes exactly two legs, so the EUA term is left in
    desk_convention: compare this value with 0.598 x EUA (about 42 EUR/MWh at EUA 70).
    Below that line gas displaces coal and gas demand rises; it is the demand-side anchor
    for TTF. The difference of the clean dark and clean spark rows gives the full version.

- id: sub.asia.jkm_vs_newcastle
  family: substitution
  name: JKM LNG vs Newcastle coal (Asian gas-coal, energy parity)
  sector: energy
  legs:
    - {instrument: ICE:JKM, weight: 1.0}
    - {instrument: ICE:NCF, weight: -1.0, qty_factor: 23.81}
  unit: USD/mmbtu
  tenor: main
  driver_tags: [gas_coal_switching, asia_power_demand]
  verified: false
  params:
    tenor_anchor: ICE:JKM
  notes: >-
    qty_factor 23.81 mmBtu per tonne: 6,000 kcal/kg x 1,000 kg x 3.9683 Btu/kcal. Plain
    energy parity, no efficiency adjustment (gas plants 50-55%, coal 38-42%, so gas is
    competitive in Japan and Korea up to about 1.3x coal's energy price, there being no
    meaningful carbon price). Switching capacity in Asia is limited, so this is a slow
    anchor, not a hard bound.

- id: sub.gas.jkm_vs_brent
  family: substitution
  name: JKM LNG vs Brent (spot LNG vs oil-indexed contracts)
  sector: energy
  legs:
    - {instrument: ICE:JKM, weight: 1.0}
    - {instrument: ICE:B,   weight: -1.0, qty_factor: 5.8}
  unit: USD/mmbtu
  tenor: main
  driver_tags: [oil_gas_ratio, lng_contract_slope]
  verified: false
  params:
    tenor_anchor: ICE:B
    desk_convention: "slope = JKM / Brent (0.10-0.17 is contract territory) = this row's ratio / 5.8"
  notes: >-
    qty_factor 5.8 mmBtu per barrel of crude: Brent / 5.8 is oil at energy parity. Most
    Asian term LNG is priced at 11-14% of Brent, so when spot JKM is above that slope
    buyers maximise contract volumes, below it they take the minimum and buy spot.

- id: sub.gas.ttf_vs_brent
  family: substitution
  name: TTF vs Brent (European gas vs oil, energy parity)
  sector: energy
  legs:
    - {instrument: ICE:TFM, weight: 1.0}
    - {instrument: ICE:B,   weight: -1.0, qty_factor: 5.8}
  unit: USD/mmbtu
  fx: USDEUR
  tenor: main
  driver_tags: [oil_gas_ratio]
  verified: false
  params:
    tenor_anchor: ICE:B
  notes: >-
    Brent / 5.8 mmBtu per bbl. Above oil parity (2022) industry and power switch to gasoil
    and fuel oil where they still can; residual oil-indexed pipeline contracts also
    arbitrage against the hub.

- id: sub.us.wti_vs_henry_hub
  family: substitution
  name: WTI vs Henry Hub (oil-gas, energy parity)
  sector: energy
  legs:
    - {instrument: NYMEX:CL, weight: 1.0, qty_factor: 5.8}
    - {instrument: NYMEX:NG, weight: -1.0}
  unit: USD/mmbtu
  tenor: main
  driver_tags: [oil_gas_ratio, us_associated_gas]
  verified: false
  params:
    tenor_anchor: NYMEX:CL
    desk_convention: "quoted as the plain ratio WTI / NG (6 = energy parity, 15-40 is normal since shale) = this row's ratio x 5.8"
  notes: >-
    WTI / 5.8 mmBtu per bbl minus Henry Hub. Little direct switching is left in the US; the
    link is supply-side: high oil prices bring associated gas and depress Henry Hub. A
    macro regime indicator more than a mean-reverting pair.
