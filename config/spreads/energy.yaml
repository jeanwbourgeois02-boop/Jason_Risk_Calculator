- id: bench.lpg.afei_vs_mont_belvieu
  family: benchmark
  name: AFEI propane vs Mont Belvieu propane (US-Asia LPG arb)
  sector: energy
  legs:
    - {instrument: NYMEX:7E, weight: 1.0}
    - {instrument: NYMEX:B0, weight: -1.0, qty_factor: 0.0019194}
