- id: proc.us.crack_321
  family: processing
  name: US 3-2-1 crack (RBOB, heating oil, WTI)
  sector: energy
  legs:
    - {instrument: NYMEX:RB, weight: 0.666667}
    - {instrument: NYMEX:HO, weight: 0.333333}
    - {instrument: NYMEX:CL, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [us_refining_margin]
  verified: false
  params:
    tenor_anchor: NYMEX:CL       # CL M expires about the 20th of M-1, products at the end of M-1
    conversion_cost: 5.0
    conversion_cost_range: [4.0, 7.0]
  notes: >-
    Three barrels of crude make two of gasoline and one of distillate:
    (2 x RB x 42 + 1 x HO x 42 - 3 x CL) / 3 = 0.6667 RB + 0.3333 HO - CL, per barrel of
    crude. RB and HO are USD/gal; 42 gal/bbl is a same-dimension conversion the engine does.
    Real yields add about 10% residue and gases, so this overstates a real margin; it is
    the benchmark hedge ratio, not a P&L. Same delivery month on all three legs. Opex
    4-7 USD/bbl incl. RINs for context.

- id: proc.us.crack_211
  family: processing
  name: US 2-1-1 crack (RBOB, heating oil, WTI)
  sector: energy
  legs:
    - {instrument: NYMEX:RB, weight: 0.5}
    - {instrument: NYMEX:HO, weight: 0.5}
    - {instrument: NYMEX:CL, weight: -1.0}
  unit: USD/bbl
  tenor: main
  driver_tags: [us_refining_margin]
  verified: false
  params:
    tenor_anchor: NYMEX:CL
    conversion_cost: 5.0
    conversion_cost_range: [4.0, 7.0]
  notes: >-
    (1 x RB x 42 + 1 x HO x 42 - 2 x CL) / 2. Closer to a distillate-heavy (Gulf Coast or
    European) yield than the 3-2-1.

