- id: bench.distillate.ho_vs_gasoil
  family: benchmark
  name: NYMEX heating oil vs ICE gasoil (HOGO)
  sector: energy
  legs:
    - {instrument: NYMEX:HO, weight: 1.0}
    - {instrument: ICE:G,    weight: -1.0, qty_factor: 7.45}
  unit: USD/bbl
  tenor: main
  driver_tags: [distillate_atlantic_arb]
  verified: false
  params:
    tenor_anchor: NYMEX:HO     # HO M expires end of M-1, gasoil M on about the 12th of M
    desk_convention: "HOGO is quoted in US cents per gallon: divide this value by 0.42"
    arb_bound:
      type: location_arb
      from_leg: NYMEX:HO
      to_leg: ICE:G
      cost_items: {freight_usgc_to_ara: 3.0}
      total_cost: 3.0
      formula: "US diesel flows to Europe when gasoil - ho > freight; HOGO below about -3 USD/bbl opens it"
  notes: >-
    Transatlantic diesel arb. HO is USD/gal (x42, same dimension, engine converts); gasoil is
    USD/t divided by 7.45 bbl/t, the market-standard gasoil factor. Europe is structurally
    short diesel, so HOGO is usually negative; it turns positive on US East Coast tightness
    (cold snaps, refinery outages).

- id: bench.distillate.sing_gasoil_vs_ice_gasoil
  family: benchmark
  name: Singapore gasoil vs ICE gasoil (gasoil East-West)
  sector: energy
  legs:
    - {instrument: NYMEX:SG, weight: 1.0, qty_factor: 0.13423}
    - {instrument: ICE:G,    weight: -1.0}
  unit: USD/t
  tenor: main
  driver_tags: [distillate_east_west]
  verified: false
  params:
    tenor_anchor: ICE:G
    desk_convention: "EW = Singapore gasoil swap x 7.45 minus ICE gasoil, USD/t, same month"
    arb_bound:
      type: location_arb
      from_leg: NYMEX:SG
      to_leg: ICE:G
      cost_items: {freight_east_to_nwe: 45.0}
      total_cost: 45.0
      formula: "East-to-West diesel arb open when EW < -total_cost (USD/t)"
  notes: >-
    qty_factor 0.13423 t per bbl = 1 / 7.45, so the Singapore leg becomes USD/t the way the
    market quotes the EW. Normally negative (-10 to -40); below roughly -45 Indian and Gulf
    barrels go west. Freight number confidence: low; it doubled with Red Sea diversions.

- id: bench.gasoline.rbob_vs_eurobob
