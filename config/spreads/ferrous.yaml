# Copied unchanged (apart from this header) on 2026-09-24 by the contract-master lane from the
# research app: Commodity Dashboard/rvapp/universe/spreads/ferrous.yaml. A template only: nothing in
# the app reads it yet (spreads-engine, Phase 3). Leg `instrument` values are contract roots
# (config/contracts.csv root_id).
# Ferrous spreads. One entry per spread; calendars come from calendar_rules.yaml.
# Destination: rvapp/universe/spreads/ferrous.yaml (the three Phase 0 seed ids are kept).
# Format: rvapp/universe/validate.py. Extensions used inside `params` are defined in NOTES.md:
#   vat_basis, tenor_anchor, arb_bound, conversion_cost(+_range), desk_convention, legacy_crosscheck.
# Nothing here has been reviewed by a human: verified is false everywhere.

# =====================================================================
# BENCHMARK - same commodity, different venue, grade or location
# =====================================================================

- id: bench.ore.dce_vs_sgx62
  family: benchmark
  name: DCE iron ore vs SGX 62% iron ore
  sector: ferrous
  legs:
    - {instrument: DCE:I,   weight: 1.0}
    - {instrument: SGX:FEF, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [ore_onshore_offshore, china_import_arb]
  verified: false
  params:
    ratio_screen: true
    level_breaks: [{date: "2025-08-29", shift: 1.8}]   # SGX 62% -> 61% Fe from the Jan-26 contract; size is an estimate, measure it on real data
    vat_basis: ex_vat          # DCE price / 1.13 before FX; SGX carries no VAT
    tenor_anchor: DCE:I        # SGX leg uses the same delivery month as DCE's main contract
    arb_bound:
      type: import_parity
      onshore_leg: DCE:I
      offshore_leg: SGX:FEF
      freight_usd_t: 0         # SGX is already CFR China
      import_duty: 0.0
      vat_rate: 0.13
      port_charges_cny_t: 30   # discharge, port construction fee, agency; ~25-35 per wet t
      grade_adjustment_usd_t: 0
      formula: "parity_cny_t = (offshore_usd_t + freight_usd_t + grade_adjustment_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when onshore_cny_t > parity_cny_t"
  notes: >-
    The core ferrous benchmark. Both legs are per dry tonne, so no moisture term.
    Import parity = SGX x FX x 1.13 VAT + about 30 CNY/t port charges; duty is zero.
    DCE delivers 61% Fe and prices the cheapest deliverable brand, so it sits structurally
    below parity; trade the deviation from its own history, not the raw level.
    grade_adjustment is 0 for 2026+ contracts (SGX moved to 61% Fe); for older history
    SGX was 62% Fe, worth roughly 1.5-2 USD/t more - the series has a break at the
    Jan-26 contract. Without tenor_anchor the spread would embed 1-4 months of SGX
    backwardation, which is often several USD/t.

- id: bench.ore.dce_vs_sgx65
  family: benchmark
  name: DCE iron ore vs SGX 65% iron ore
  sector: ferrous
  legs:
    - {instrument: DCE:I,    weight: 1.0}
    - {instrument: SGX:M65F, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [ore_onshore_offshore, ore_grade_premium, china_import_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat          # DCE price / 1.13 before FX; SGX carries no VAT
    tenor_anchor: DCE:I        # SGX leg uses the same delivery month as DCE's main contract
    arb_bound:
      type: import_parity
      onshore_leg: DCE:I
      offshore_leg: SGX:M65F
      freight_usd_t: 0         # SGX is already CFR China
      import_duty: 0.0
      vat_rate: 0.13
      port_charges_cny_t: 30
      grade_adjustment_usd_t: 0   # 65% Brazilian fines against DCE's 61% deliverable: the premium is the signal, so no adjustment
      formula: "parity_cny_t = (offshore_usd_t + freight_usd_t + grade_adjustment_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; DCE prices the cheapest 61% brand, so it sits well below this parity"
  notes: >-
    DCE against the high-grade seaborne index: bench.ore.dce_vs_sgx62 plus the 65/62
    premium, so the ratio falls when mills pay up for productivity (high margins, output
    curbs) and rises when they chase cheap units. No level break: the MB 65% index did not
    change specification. SGX:M65F liquidity sits in the first 3-4 months; with the DCE
    anchor the SGX leg is often 4-7 months out, so expect thin settlements there
    (calendar_depth raised to 7 for this row). Added 2026-09-22 for the metals ratio screen.

- id: bench.ore.dce_vs_cme
  family: benchmark
  name: DCE iron ore vs CME 62% iron ore
  sector: ferrous
  legs:
    - {instrument: DCE:I,   weight: 1.0}
    - {instrument: CME:TIO, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [ore_onshore_offshore, ore_venue_basis, china_import_arb]
  verified: false
  params:
    ratio_screen: true
    level_breaks: [{date: "2025-08-29", shift: 1.8}]   # as bench.ore.dce_vs_sgx62: the Jan-26 contracts settle on the 61% Fe index; measure it on real data
    vat_basis: ex_vat
    tenor_anchor: DCE:I
    arb_bound:
      type: import_parity
      onshore_leg: DCE:I
      offshore_leg: CME:TIO
      freight_usd_t: 0
      import_duty: 0.0
      vat_rate: 0.13
      port_charges_cny_t: 30
      grade_adjustment_usd_t: 0
      formula: "as bench.ore.dce_vs_sgx62"
  notes: >-
    The CME twin of bench.ore.dce_vs_sgx62: same Platts index as SGX:FEF, so the two rows
    should differ only by settlement-time noise and the CME leg's thinner back months. In
    the screen because the China list names CME TIO; if the allowance is tight this row
    and CME:TIO are the first to drop (calendar_depth raised to 7 so the DCE anchor month
    is inside the generics). Added 2026-09-22 for the metals ratio screen.

- id: bench.ore.sgx65_vs_sgx62
  family: benchmark
  name: SGX 65% vs SGX 62% iron ore (high-grade premium)
  sector: ferrous
  legs:
    - {instrument: SGX:M65F, weight: 1.0}
    - {instrument: SGX:FEF,  weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [ore_grade_premium, china_steel_margin]
  verified: false
  params:
    level_breaks: [{date: "2025-12-01", shift: 1.8}]   # SGX 62% -> 61% Fe from the Jan-26 contract; size is an estimate, measure it on real data
  notes: >-
    Premium for Brazilian high-grade fines. Widens when mill margins and coke prices are
    high (mills pay for productivity) and under output curbs; collapses when margins are
    negative. m+1 on both legs guarantees the same month; the front month is the
    part-priced averaging month. From the Jan-26 contract the base leg is 61% Fe, so the
    premium steps up by about 1.5-2 USD/t - a break, not a signal.

