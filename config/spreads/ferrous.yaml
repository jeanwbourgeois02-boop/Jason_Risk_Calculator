- id: bench.coal.dce_vs_sgx_fob_aus
  family: benchmark
  name: DCE coking coal vs SGX premium HCC FOB Australia
  sector: ferrous
  legs:
    - {instrument: DCE:JM,  weight: 1.0}
    - {instrument: SGX:ACF, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [coking_coal_import_arb, china_import_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: ex_vat
    tenor_anchor: DCE:JM
    arb_bound:
      type: import_parity
      onshore_leg: DCE:JM
      offshore_leg: SGX:ACF
      freight_usd_t: 15        # Queensland-North China, Panamax/Cape; moves 10-25
      import_duty: 0.0         # Australia under ChAFTA; 3% MFN for other origins since 2024
      vat_rate: 0.13
      port_charges_cny_t: 40
      grade_adjustment_usd_t: 0
      formula: "parity_cny_t = (offshore_usd_t + freight_usd_t + grade_adjustment_usd_t) * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when onshore_cny_t > parity_cny_t"
  notes: >-
    Loose link. SGX is premium low-vol FOB Queensland; DCE delivers domestic and Mongolian
    grade main coking coal, usually worth less, so the level is not a clean arb and
    grade_adjustment is left at 0 rather than guessed. Useful as onshore-vs-seaborne
    direction. Expect weak cointegration; the health score should down-weight it.
    Freight and port numbers are confidence: low.

- id: bench.hrc.cme_vs_shfe
  family: benchmark
  name: SHFE HRC vs CME HRC (China discount to the US)
  sector: ferrous
  legs:
    - {instrument: SHFE:HC, weight: 1.0}
    - {instrument: CME:HRC, weight: -1.0}
  unit: USD/st
  fx: USDCNH
  tenor: main
  driver_tags: [hrc_arb, us_steel_premium]
  verified: false
  params:
    ratio_screen: true
    vat_basis: inc_vat         # China's HRC export VAT rebate is zero since Aug 2021
    tenor_anchor: SHFE:HC
    desk_convention: "the desk and the legacy Steel pulse quote US / China; this row is China / US, the reciprocal"
  notes: >-
    China first (ratio SHFE / CME), same delivery month: the stored value is the Chinese
    discount to the US Midwest, normally negative. SHFE is converted CNY/t to USD/st
    (divide by FX and by 1.10231). VAT stays in because exporters get no rebate, so the
    VAT-inclusive domestic price is the export cost base. The arb is shut by Section 232
    and AD/CVD duties, so this is a regional premium that mean-reverts slowly, not a
    bound. Re-ordered China-first on 2026-09-22 (id kept; the history changes sign). See
    bench.hrc.cme_vs_shfe_delivered for the legacy Steel pulse form, which stays US-first.

- id: bench.hrc.cme_vs_shfe_delivered
  family: benchmark
  name: CME HRC less 300 delivery cost vs SHFE HRC (legacy Steel pulse)
  sector: ferrous
  legs:
    - {instrument: CME:HRC, weight: 1.0}
    - {instrument: SHFE:HC, weight: -1.0}
  unit: USD/st
  fx: USDCNH
  tenor: front
  constant: -300
  driver_tags: [hrc_arb, us_steel_premium]
  verified: false
  params:
    vat_basis: inc_vat
    legacy_crosscheck: true
    desk_convention: "ratio = (CME_HRC + constant) / SHFE_HC_in_USD_per_st"
  notes: >-
    PLAN.md section 8 cross-check. Legacy computes (HRC1 - 300) / (ROC1 in USD per short
    ton) on generic front contracts, VAT left in. This row's RATIO with the constant
    applied to the first leg must match it, apart from the legacy fixed FX of 7.16 and
    its 0.91 rounding of 1/1.10231. The 300 USD/st is the user's delivered-cost allowance.

- id: bench.hrc.lme_fob_china_vs_shfe
  family: benchmark
  name: SHFE HRC vs LME HRC FOB China (export parity)
  sector: ferrous
  legs:
    - {instrument: SHFE:HC, weight: 1.0}
    - {instrument: LME:HC,  weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [china_steel_export, hrc_arb]
  verified: false
  params:
    ratio_screen: true
    vat_basis: inc_vat
    tenor_anchor: SHFE:HC
    desk_convention: "stored value = SHFE (VAT in, USD/t) minus FOB China; positive when export coil trades below the domestic price"
    arb_bound:
      type: export_parity
      onshore_leg: SHFE:HC
      offshore_leg: LME:HC
      export_vat_rebate: 0.0
      vat_rate: 0.13
      export_cost_cny_t: 80    # inland freight to port plus FOB charges
      formula: "fob_parity_usd_t = (onshore_cny_t * (1 - export_vat_rebate / (1 + vat_rate)) + export_cost_cny_t) / USDCNH; exports pay when offshore_usd_t > fob_parity_usd_t, i.e. when the stored value is below -export_cost_cny_t / USDCNH"
  notes: >-
    The tightest China-to-world steel link, China first (ratio SHFE / FOB). With a zero
    rebate the FOB price should sit near the VAT-inclusive Shanghai price plus about
    80 CNY/t of export cost, so the stored value should be slightly negative. FOB often
    trades below the domestic price because of untaxed 'buy-order' exports: a rising
    positive value flags export pressure. export_cost is confidence: low. Re-ordered
    China-first on 2026-09-22 (id kept; the history changes sign). When LME Steel HRC
    Shanghai lists (27 Oct 2026) it will be a cleaner offshore proxy for the SHFE leg.

- id: bench.hrc.cme_vs_lme_fob_china
  family: benchmark
  name: CME HRC vs LME HRC FOB China
  sector: ferrous
  legs:
    - {instrument: CME:HRC, weight: 1.0}
    - {instrument: LME:HC,  weight: -1.0}
  unit: USD/st
  tenor: m+1
  driver_tags: [hrc_arb, us_steel_premium]
  verified: false
  params:
    arb_bound:
      type: import_parity
      onshore_leg: CME:HRC
      offshore_leg: LME:HC
      freight_usd_t: 70
      import_duty: 0.50        # Section 232, raised to 50% in June 2025; levied on FOB value
      other_usd_t: 40          # US port, inland freight to the Midwest
      formula: "parity_usd_st = (offshore_usd_t * (1 + import_duty) + freight_usd_t + other_usd_t) / 1.10231; imports pay when onshore_usd_st > parity_usd_st"
  notes: >-
    All-USD, all-offshore version of the US premium: no FX, no VAT, no China access
    needed. Chinese HRC itself is kept out by AD/CVD, so read the bound as the price at
    which generic Asian-priced coil reaches the Midwest. Freight and other costs are
    confidence: low.

- id: bench.hrc.cme_us_vs_cme_nwe
  family: benchmark
  name: CME US Midwest HRC vs CME North European HRC
  sector: ferrous
