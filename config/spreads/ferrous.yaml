- id: bench.hrc.cme_nwe_vs_lme_fob_china
  family: benchmark
  name: CME North European HRC vs LME HRC FOB China
  sector: ferrous
  legs:
    - {instrument: CME:EHR, weight: 1.0}
    - {instrument: LME:HC,  weight: -1.0}
  unit: USD/t
  fx: USDEUR
  tenor: m+1
  driver_tags: [eu_steel_premium, china_steel_export]
  verified: false
  notes: >-
    European premium over Asian export coil. Bounded in practice by freight (roughly
    50-70 USD/t), EU safeguard quotas and out-of-quota duty, AD duties on China and CBAM
    from 2026. No arb_bound given: the duty stack changes too often to hard-code.

- id: bench.rebar.lme_turkey_vs_shfe
  family: benchmark
  name: SHFE rebar vs LME rebar FOB Turkey
  sector: ferrous
  legs:
    - {instrument: SHFE:RB, weight: 1.0}
    - {instrument: LME:SR,  weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [china_steel_export, global_rebar]
  verified: false
  params:
    ratio_screen: true
    vat_basis: inc_vat         # rebar export rebate is also zero
    tenor_anchor: SHFE:RB
  notes: >-
    The two rebar futures that exist, China first (ratio SHFE / Turkey FOB, SHFE VAT in).
    They compete in the Middle East, North Africa and Southeast Asia rather than
    arbitraging directly, so the link is loose: BF ore-and-coke economics (China) against
    EAF scrap economics (Turkey). A high ratio means Chinese rebar is expensive next to
    the export market. Re-ordered China-first on 2026-09-22 (id kept; the history changes
    sign).

- id: bench.scrap.cme_bus_vs_lme_turkey
  family: benchmark
  name: CME Chicago busheling vs LME scrap CFR Turkey
  sector: ferrous
  legs:
    - {instrument: CME:BUS, weight: 1.0}
    - {instrument: LME:SC,  weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [scrap_global]
  verified: false
  notes: >-
    US prime scrap against the world's marginal obsolete-scrap import price. Busheling is
    USD per gross ton: divide by 1.01605 to get USD/t. Grade (prime vs HMS 80:20) and
    location both differ, so it is a premium, not an arb. US East Coast HMS exports to
    Turkey are the physical link.

# =====================================================================
# PROCESSING ("Crack") - product minus raw materials at physical yields
# Gross material spreads: constant stays 0. The conversion cost is a range that drifts,
# so its central estimate sits in params.conversion_cost for the engine's cost line.
# =====================================================================

- id: proc.cn.rebar_mill_margin
  family: processing
  name: China rebar mill margin
  sector: ferrous
  legs:
    - {instrument: SHFE:RB, weight: 1.0}
    - {instrument: DCE:I,   weight: -1.6}
    - {instrument: DCE:J,   weight: -0.5}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [china_steel_margin]
  verified: false
  params:
    conversion_cost: 1000
    conversion_cost_range: [800, 1200]
  notes: >-
    Blast-furnace route, per tonne of steel. Ore: hot metal is about 94.5% Fe, so 1 t
    needs 0.945 / 0.615 = 1.54 t of dry ore, about 1.6 t after sinter and furnace losses.
    Coke: BF coke rate is 0.35-0.40 t plus about 0.15 t of injected PCI coal, which has
    no future, so desks load it onto coke: 0.5 t. About 10% scrap charge offsets BOF and
    rolling losses, so hot metal to rebar is taken as 1:1. All legs are CNY/t with VAT
    in, so VAT cancels. Each leg uses its own main contract: the desk pairs RB 01/05/10
    with I and J 01/05/09. Value is the gross material spread; subtract roughly
    800-1200 CNY/t (alloys, power, labour, depreciation, rolling) for a margin.

- id: proc.cn.hrc_mill_margin
  family: processing
  name: China HRC mill margin
  sector: ferrous
  legs:
    - {instrument: SHFE:HC, weight: 1.0}
    - {instrument: DCE:I,   weight: -1.6}
    - {instrument: DCE:J,   weight: -0.5}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  params:
    conversion_cost: 1100
    conversion_cost_range: [900, 1300]
  notes: >-
    Same arithmetic as proc.cn.rebar_mill_margin: 1.6 t ore + 0.5 t coke per tonne.
    Hot-strip rolling costs a little more than a bar mill, hence the higher cost line.

- id: proc.cn.rebar_mill_margin_coal
  family: processing
  name: China rebar mill margin, coking-coal basis
  sector: ferrous
  legs:
    - {instrument: SHFE:RB, weight: 1.0}
    - {instrument: DCE:I,   weight: -1.6}
    - {instrument: DCE:JM,  weight: -0.65}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  params:
    conversion_cost: 1150
    conversion_cost_range: [950, 1350]
  notes: >-
    Integrated mill with its own coke ovens. 0.5 t coke x 1.3 t coal per t coke = 0.65 t
    coking coal. Cost line is the rebar one plus about 150 CNY/t of coking cost net of
    by-products. Preferable to the coke version when DCE:J is too thin to trade.

- id: proc.cn.hrc_mill_margin_coal
  family: processing
  name: China HRC mill margin, coking-coal basis
  sector: ferrous
  legs:
    - {instrument: SHFE:HC, weight: 1.0}
    - {instrument: DCE:I,   weight: -1.6}
    - {instrument: DCE:JM,  weight: -0.65}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  params:
    conversion_cost: 1250
    conversion_cost_range: [1050, 1450]
  notes: 1.6 t ore + 0.65 t coking coal (0.5 t coke x 1.3). See proc.cn.rebar_mill_margin_coal.

- id: proc.cn.coking_margin
  family: processing
  name: China coking margin (coke minus coking coal)
  sector: ferrous
  legs:
    - {instrument: DCE:J,  weight: 1.0}
    - {instrument: DCE:JM, weight: -1.3}
  unit: CNY/t
  tenor: main
  driver_tags: [china_coking_margin]
  verified: false
  params:
    conversion_cost: 150
    conversion_cost_range: [50, 250]
    desk_convention: "also watched as the plain price ratio J / JM"
  notes: >-
    Coke yield from a dry coal blend is 75-77%, so 1 t coke needs 1 / 0.76 = 1.3 t coal.
    Desks use 1.3 to 1.4; 1.3 is the common one. DCE:JM is prime hard coking coal while a
    real blend includes cheaper fat, lean and gas coals, so the level understates the true
    margin; use z-scores. By-product credits (tar, benzol, gas) offset much of the
    conversion cost, hence the low cost line.

- id: proc.cn.rebar_vs_ore
  family: processing
  name: China rebar vs iron ore (ore-only margin)
  sector: ferrous
  legs:
    - {instrument: SHFE:RB, weight: 1.0}
    - {instrument: DCE:I,   weight: -1.6}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  params:
    desk_convention: "watched as the plain price ratio RB / I (luo-kuang bi)"
  notes: >-
    1.6 t ore per tonne of steel (see proc.cn.rebar_mill_margin). The most traded
    steel-vs-raw-material pair in China; the z-score of RB - 1.6 x I and of RB / I tell
    the same story.

- id: proc.cn.rebar_vs_coke
  family: processing
  name: China rebar vs coke (coke-only margin)
  sector: ferrous
  legs:
    - {instrument: SHFE:RB, weight: 1.0}
    - {instrument: DCE:J,   weight: -0.5}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  params:
    desk_convention: "watched as the plain price ratio RB / J (luo-jiao bi)"
  notes: 0.5 t coke per tonne of steel (see proc.cn.rebar_mill_margin).

- id: proc.cn.hrc_vs_ore
  family: processing
  name: China HRC vs iron ore (ore-only margin)
  sector: ferrous
  legs:
    - {instrument: SHFE:HC, weight: 1.0}
    - {instrument: DCE:I,   weight: -1.6}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  notes: 1.6 t ore per tonne of steel. Manufacturing-and-export-led version of rebar vs ore.

- id: proc.cn.hrc_vs_coke
  family: processing
  name: China HRC vs coke (coke-only margin)
  sector: ferrous
  legs:
    - {instrument: SHFE:HC, weight: 1.0}
    - {instrument: DCE:J,   weight: -0.5}
  unit: CNY/t
  tenor: main
  driver_tags: [china_steel_margin]
  verified: false
  notes: 0.5 t coke per tonne of steel.

- id: proc.global.hrc_fob_china_margin
  family: processing
  name: Offshore China steel margin (LME HRC FOB China vs SGX ore and coking coal)
  sector: ferrous
  legs:
    - {instrument: LME:HC,  weight: 1.0}
    - {instrument: SGX:FEF, weight: -1.6}
    - {instrument: SGX:ACF, weight: -0.7}
  unit: USD/t
  tenor: m+1
  driver_tags: [china_steel_margin, offshore_steel_margin]
  verified: false
  params:
    level_breaks: [{date: "2025-12-01", shift: 2.88}]   # SGX 62% -> 61% Fe from the Jan-26 contract; size is an estimate, measure it on real data
    conversion_cost: 150
    conversion_cost_range: [120, 190]
  notes: >-
    The China mill margin built only from contracts an offshore account can trade.
    1.6 t ore + 0.7 t coking coal (0.5 t coke x 1.4 t seaborne coal per t coke; worldsteel
    gives 0.78 t met coal including PCI). The onshore rows use 1.3; the difference does
    not move z-scores. Caveats: coal is FOB Australia (add about 15 USD/t x 0.7 freight),
    and the FOB steel price carries unrebated Chinese VAT while the raw materials are
    VAT-free, so the level overstates the true margin. confidence: medium on 0.7.

- id: proc.us.eaf_hrc_vs_busheling
  family: processing
  name: US EAF metal spread (CME HRC minus busheling scrap)
  sector: ferrous
  legs:
    - {instrument: CME:HRC, weight: 1.0}
    - {instrument: CME:BUS, weight: -1.12}
  unit: USD/st
  tenor: m+1
  driver_tags: [us_eaf_margin, us_steel_premium]
  verified: false
  params:
    conversion_cost: 250
    conversion_cost_range: [200, 300]
    desk_convention: "quoted as HRC in USD/st minus busheling in USD/gross ton, unconverted"
  notes: >-
    Busheling is USD per gross ton (2240 lb): the engine first converts it to USD/st by
    dividing by 1.12. An EAF flat-rolled mill charges 1.07-1.15 st of scrap per st of
    coil (melt yield about 91%, casting and hot rolling about 97%). Weight 1.12 is
    inside that range AND makes the value identical to the industry's quoted 'metal
    spread' (HRC $/st minus busheling $/gt), because 1.12 x (BUS / 1.12) = BUS.
    Real charges mix busheling with shred, HMS, pig iron and DRI; busheling is the
    prime-grade marker. conversion_cost is confidence: low.

- id: proc.tr.rebar_scrap_spread
  family: processing
  name: Turkey rebar minus scrap (market-convention 1:1 spread)
  sector: ferrous
  legs:
    - {instrument: LME:SR, weight: 1.0}
    - {instrument: LME:SC, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [turkey_eaf_margin]
  verified: false
  params:
    conversion_cost: 180
    conversion_cost_range: [160, 210]
    desk_convention: "the published Turkish rebar-scrap spread is 1:1"
  notes: >-
    The number every price reporter publishes. It is NOT yield-adjusted: the 1:1 spread
    has to cover yield loss (about 13% of the scrap price) as well as conversion, which
    is why the break-even quoted for it is about 160-210 USD/t. The yield-adjusted
    margin is proc.tr.rebar_eaf_margin. Note FOB steel against CFR scrap: no freight term.

- id: proc.tr.rebar_eaf_margin
  family: processing
  name: Turkey EAF rebar margin (yield-adjusted)
  sector: ferrous
  legs:
    - {instrument: LME:SR, weight: 1.0}
    - {instrument: LME:SC, weight: -1.13}
  unit: USD/t
  tenor: m+1
  driver_tags: [turkey_eaf_margin]
  verified: false
  params:
    conversion_cost: 130
    conversion_cost_range: [110, 160]
  notes: >-
    HMS 80:20 melts at about 90% metallic yield; casting and bar rolling keep about 98%:
    1 / (0.90 x 0.98) = 1.13 t scrap per tonne of rebar. conversion_cost (power,
    electrodes, alloys, labour) is confidence: low.

- id: proc.cn.stainless_vs_nickel
  family: processing
  name: SHFE stainless minus nickel content
  sector: ferrous
  legs:
    - {instrument: SHFE:SS, weight: 1.0}
    - {instrument: SHFE:NI, weight: -0.08}
  unit: CNY/t
  tenor: main
  driver_tags: [stainless_nickel]
  verified: false
  notes: >-
    304 stainless is 8% nickel and 18% chromium: 0.08 t Ni per tonne. The value is what
    is left for chrome units (about 0.36 t of 50% Cr ferrochrome), iron units and
    conversion including cold rolling (the deliverable is 2B cold-rolled coil). Chinese
    mills buy nickel units mostly as NPI at a moving discount to refined nickel, so the
    SHFE:NI leg overstates cost and the residual is a relative-value signal, not a P&L.
    External leg: SHFE:NI (base metals).

- id: proc.ore.fob_netback_c5
  family: processing
  name: Iron ore FOB Australia netback (SGX 62% minus C5 freight)
  sector: ferrous
  legs:
    - {instrument: SGX:FEF, weight: 1.0}
    - {instrument: SGX:C5,  weight: -1.087}
  unit: USD/t
  tenor: m+1
  driver_tags: [ore_freight]
  verified: false
  params:
    level_breaks: [{date: "2025-12-01", shift: -1.8}]   # SGX 62% -> 61% Fe from the Jan-26 contract; size is an estimate, measure it on real data
  notes: >-
    Ore is priced per dry tonne, freight is paid per wet tonne. At about 8% moisture,
    1 dry tonne ships as 1 / 0.92 = 1.087 wet tonnes, hence the weight. The value is the
    miner's FOB Pilbara netback; long ore / short freight is the classic expression.
    External leg: SGX:C5, every attribute of which is confidence: low.

