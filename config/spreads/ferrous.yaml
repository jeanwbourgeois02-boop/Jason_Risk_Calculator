  name: SHFE rebar vs SHFE HRC
  sector: ferrous
  legs:
    - {instrument: SHFE:RB, weight: 1.0}
    - {instrument: SHFE:HC, weight: -1.0}
  unit: CNY/t
  tenor: main
  driver_tags: [china_long_vs_flat]
  verified: false
  params:
    desk_convention: "China quotes it the other way round: juan-luo cha = HC - RB"
  notes: >-
    Construction steel against manufacturing and export steel; property and
    infrastructure against autos, appliances and machinery. Mills swing hot metal between
    the two, which caps the spread at a few hundred CNY/t. Both legs share the 01/05/10
    cycle. Sign kept as in the Phase 0 seed (RB - HC).

