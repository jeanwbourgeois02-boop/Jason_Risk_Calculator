# Copied unchanged (apart from this header) on 2026-09-24 by the contract-master lane from the
# research app: Commodity Dashboard/rvapp/universe/spreads/chemicals.yaml. A template only: nothing in
# the app reads it yet (spreads-engine, Phase 3). Leg `instrument` values are contract roots
# (config/contracts.csv root_id).
# Housekeeper, at merge: sub.cn.psf_vs_cotton, sub.cn.br_vs_ru and sub.cn.br_vs_nr were removed.
# They mirrored agriculture's sub.cn.cotton_vs_psf, sub.cn.ru_vs_br and sub.cn.nr_vs_br leg for leg.
# Chemicals spreads. One entry per spread; calendars come from calendar_rules.yaml.
# Destination: rvapp/universe/spreads/chemicals.yaml.
# Format: rvapp/universe/validate.py. Extensions inside `params` follow research/ferrous/NOTES.md
# (vat_basis, tenor_anchor, arb_bound, conversion_cost(+_range), desk_convention) plus
# `physical_yields` (context only) and arb_bound type `location_arb` as used by energy.
# Every stored series is the straight paper spread. Freight, duty, VAT and conversion cost sit in
# params as context and are never subtracted. Nothing here has been reviewed by a human.
#
# Tenor rules used throughout:
#   - Two Chinese 1/5/9 legs: `main` on each leg (same month in practice).
#   - A monthly-rolling Chinese leg (EB, BZ, PF, PR, PL, BR) against a 1/5/9 leg: tenor_anchor on
#     the monthly roller where the other leg's off-cycle months still price (TA, EG); otherwise
#     each leg's own main contract, which is the domestic desk convention.
#   - A Chinese leg against a liquid offshore monthly curve (Brent, MOPJ naphtha, AFEI propane):
#     tenor_anchor on the Chinese leg.
#   - Two monthly cash-settled swaps: `m+1` (the front month is the part-priced averaging month).
#   - Domestic CNY pairs are left as quoted (VAT in), the way desks chart them, even where the two
#     VAT rates differ (LPG, urea, rubber, cotton are 9%); the note says so.
#   - Crude legs in per-tonne spreads: qty_factor 0.13643 t per bbl = 1 / 7.33 bbl per t, the
#     generic crude factor energy uses (Energy Institute approximate conversion; Brent itself
#     is nearer 7.53).

# =====================================================================
# BENCHMARK - thin by nature: almost all of this sector trades only in China.
# The only offshore paper with real open interest is CME fertiliser and Mont Belvieu olefins.
# =====================================================================

- id: bench.urea.zce_vs_fob_middle_east
  family: benchmark
  name: ZCE urea vs urea FOB Middle East (China export parity)
  sector: chemicals
  legs:
    - {instrument: ZCE:UR,   weight: 1.0}
    - {instrument: CBOT:UME, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [urea_export_window, china_export_policy, fertiliser_global]
  verified: false
  params:
    vat_basis: inc_vat         # no export VAT rebate on urea: the VAT-inclusive price is the export cost base
    arb_bound:
      type: export_parity
      onshore_leg: ZCE:UR
      offshore_leg: CBOT:UME
      export_vat_rebate: 0.0
      export_duty: 0.0
      export_cost_cny_t: 200   # inland freight plant to port, port charges, inspection
      freight_usd_t: 0         # both FOB; China has a 5-15 USD/t freight edge into East India and SE Asia
      formula: "fob_china_usd_t = (onshore_cny_t + export_cost_cny_t) / USDCNH; exports pay when fob_china_usd_t < offshore_usd_t, but only while the inspection and quota window is open"
  notes: >-
    The one real China-to-world link in this sector, and it is a policy switch. Since Oct 2021
    urea exports need customs inspection and, in practice, a quota. Window open: ZCE converges to
    Middle East FOB less about 200 CNY/t of export cost. Window shut: China trades 50-150 USD/t
    under the world and the spread is SIGNAL ONLY (no arbitrage can close it). Each leg uses its
    own main contract: the swap curve is not marked far enough out to anchor to ZCE's 1/5/9 month,
    and urea is seasonal, so part of the level is calendar. CBOT:UME liquidity confidence: low.

- id: bench.urea.zce_vs_us_gulf
  family: benchmark
  name: ZCE urea vs urea FOB US Gulf (NOLA)
  sector: chemicals
  legs:
    - {instrument: ZCE:UR,   weight: 1.0}
    - {instrument: CBOT:UFV, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [urea_export_window, fertiliser_global]
  verified: false
  params:
    vat_basis: inc_vat
  notes: >-
    SIGNAL ONLY. China does not ship urea to the US Gulf, so nothing bounds this. It is here
    because NOLA is the liquid urea swap: if the Middle East contract turns out not to be marked
    daily, this is the usable China-vs-world urea series. NOLA is quoted per short ton; the engine
    converts to USD/t (x 1.10231). NOLA carries its own spring-application seasonality.

- id: bench.urea.us_gulf_vs_middle_east
  family: benchmark
  name: Urea FOB US Gulf (NOLA) vs FOB Middle East
  sector: chemicals
  legs:
    - {instrument: CBOT:UFV, weight: 1.0}
    - {instrument: CBOT:UME, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [urea_atlantic_arb, fertiliser_global]
  verified: false
  params:
    arb_bound:
      type: location_arb
      from_leg: CBOT:UME
      to_leg: CBOT:UFV
      cost_items: {freight_ag_to_nola: 45.0}
      total_cost: 45.0
      formula: "Middle East cargoes flow to the US Gulf when UFV - UME > total_cost (USD/t, NOLA barge vs FOB AG; ignores the barge-vs-vessel discount)"
  notes: >-
    The main offshore urea location spread. NOLA must pull Arab Gulf tonnes in Jan-Apr, so the
    spread approaches freight (35-55 USD/t) in spring and goes to zero or negative in the summer
    fill season. Freight number confidence: low. Short tons converted by the engine.

