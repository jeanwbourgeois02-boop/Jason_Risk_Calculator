  verified: false
  params:
    conversion_cost: 0.06
    conversion_cost_range: [0.04, 0.08]
    desk_convention: "ethylene cash cost in c/lb = ethane c/gal x 0.43 + about 5-7 c/lb"
  notes: >-
    qty_factor 2.97 lb per gal (liquid ethane, specific gravity 0.3562 x 8.337 lb per gal of
    water), so ethane becomes USD/lb. Yield: ethane cracking with recycle gives about 0.78 lb
    ethylene per lb ethane = 1.28 lb ethane per lb ethylene; 1.28 / 2.97 = 0.43 gal per lb, the
    desk shorthand. Both legs are thin cleared swaps; NYMEX:C0 is not yet in the energy
    universe. confidence: low on liquidity.

- id: proc.us.pdh_margin
