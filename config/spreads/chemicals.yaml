- id: proc.cn.glass_vs_soda_ash
  family: processing
  name: Float glass margin over soda ash (FG minus 0.2 SA)
  sector: chemicals
  legs:
    - {instrument: ZCE:FG, weight: 1.0}
    - {instrument: ZCE:SA, weight: -0.2}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [glass_margin, property_completions]
  verified: false
  params:
    conversion_cost: 800
    conversion_cost_range: [650, 950]
  notes: >-
    Yield: soda-lime glass is 13-14% Na2O; Na2CO3 -> Na2O is 62 / 106 = 0.585, so 0.135 / 0.585
    = 0.23 t soda ash per t of fresh melt, about 0.2 t per t of glass after 15-20% cullet (10 kg
    per 50 kg weight case). Fuel (natural gas, petcoke or coal gas, 350-500 CNY/t) is the larger
    cost and has no paper leg; sand and the rest bring non-soda cost to about 650-950 CNY/t
    (confidence: low). Float lines cannot be idled cheaply, so the margin goes deeply negative
    before supply responds.

