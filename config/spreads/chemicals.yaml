- id: proc.cn.pp_vs_propylene
  family: processing
  name: Polymerisation spread (PP minus propylene)
  sector: chemicals
  legs:
    - {instrument: DCE:PP, weight: 1.0}
    - {instrument: ZCE:PL, weight: -1.0}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [pp_polymerisation, propylene_balance]
  verified: false
  params:
    conversion_cost: 550
    conversion_cost_range: [400, 700]
    physical_yields: {propylene_t_per_t_pp: 1.01}
  notes: >-
    Propylene consumption is 1.00-1.02 t per t of pellet PP (1.03-1.05 for powder), so the desk
    quotes the plain difference. Below about 400-500 CNY/t powder plants stop and sell propylene
    instead. Each leg's own main contract; PL's cycle is still settling, confidence: low.

- id: proc.cn.lldpe_vs_naphtha
  family: processing
  name: LLDPE minus naphtha (naphtha cracker chain)
  sector: chemicals
  legs:
    - {instrument: DCE:L,    weight: 1.0}
    - {instrument: NYMEX:JA, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
