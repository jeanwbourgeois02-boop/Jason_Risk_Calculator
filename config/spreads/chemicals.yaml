    EB - BZ difference. Its breakeven: 0.29 x ethylene (about 6200) + 1100 - 0.21 x benzene
    (about 5800) = roughly 1500-1700 CNY/t. BZ only listed in Jul 2025 (first contract BZ2603),
    so history is short.

