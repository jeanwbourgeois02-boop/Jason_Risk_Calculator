    widest ahead of the Brazilian safrinha corn season (Q3-Q4 buying). Both legs thin;
    confidence: low on liquidity and on the freight number.

- id: bench.urea.egypt_vs_middle_east
  family: benchmark
  name: Urea FOB Egypt vs FOB Middle East (European premium)
  sector: chemicals
  legs:
    - {instrument: CBOT:UFE, weight: 1.0}
    - {instrument: CBOT:UME, weight: -1.0}
  unit: USD/t
  tenor: m+1
  driver_tags: [urea_europe_premium, european_gas]
  verified: false
  notes: >-
    Egypt is the duty-free supplier to Europe, so its premium over the Arab Gulf tracks European
