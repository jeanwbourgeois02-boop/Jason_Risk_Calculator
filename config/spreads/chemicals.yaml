- id: sub.cn.pvc_vs_caustic_soda
  family: substitution
  name: PVC vs caustic soda (chlor-alkali pair)
  sector: chemicals
  legs:
    - {instrument: DCE:V,  weight: 1.0}
    - {instrument: ZCE:SH, weight: -1.0}
  unit: CNY/t
  fx: null
  tenor: main
  driver_tags: [chlor_alkali_balance, property_completions, alumina_demand]
  verified: false
  params:
    physical_yields: {caustic_t_per_t_pvc: 0.75, chlorine_t_per_t_pvc: 0.6}
    desk_convention: "integrated chlor-alkali revenue = 1 t PVC + 0.75 t caustic (100%); traded as long one, short the other"
  notes: >-
    Co-products, not substitutes. Electrolysis makes 1 t chlorine with 1.13 t caustic; 1 t PVC
    absorbs about 0.6 t chlorine (Cl 35.45 / VCM 62.50 = 0.567, plus losses), so each t of PVC
    comes with 0.6 x 1.13 x about 1.1 = 0.75 t caustic. When caustic is strong (alumina demand)
    plants run hard and the chlorine must go somewhere - into PVC, which is then oversupplied:
    the two are negatively linked through the chlorine balance. The integrated revenue
    V + 0.75 SH cannot be written as a spread (all weights positive): see NOTES contract
    requests. SH is priced per tonne of 100% NaOH.

- id: sub.cn.soda_ash_vs_caustic_soda
