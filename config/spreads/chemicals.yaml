    conversion_cost: 550
    conversion_cost_range: [400, 700]
  notes: >-
    NO DATA, same reason as proc.cn.coal_to_methanol. Yield, entrained-flow gasification on
    bituminous coal: about 1.5 t coal per t ammonia x 0.58 t ammonia per t urea = 0.9 t feed,
    plus 0.3-0.4 t fuel coal = 1.2-1.4, taken as 1.3 (confidence: low; fixed-bed plants use about
    0.7 t anthracite lump plus 0.4 t fuel coal instead). UR carries 9% VAT, coal 13%.

- id: proc.us.urea_vs_henry_hub
  family: processing
  name: US Gulf urea margin over natural gas
  sector: chemicals
  legs:
    - {instrument: CBOT:UFV, weight: 1.0}
    - {instrument: NYMEX:NG, weight: -1.0, qty_factor: 0.043478}
  unit: USD/st
  tenor: main
  constant: 0
  driver_tags: [nitrogen_margin, us_gas]
  verified: false
  params:
    tenor_anchor: CBOT:UFV
    conversion_cost: 90
    conversion_cost_range: [70, 120]
  notes: >-
    qty_factor 0.043478 = 1 / 23: one mmBtu of gas makes 1/23 short ton of urea, so the gas leg
    becomes 23 x Henry Hub per short ton. Arithmetic: about 33 mmBtu per st ammonia x 0.575 st
    ammonia per st urea = 19, plus 3-4 for urea synthesis and granulation = 22-24 (confidence:
    low). The factor is a process intensity, not a unit conversion: mass and energy have no
    other link (energy's spark spreads do the same). US producers sit at the bottom of the cost
    curve, so this is a margin-capture measure, not a bound.

- id: proc.us.ethane_cracker_margin
  family: processing
  name: US ethane cracker margin (Mont Belvieu ethylene minus 1.28 ethane)
  sector: chemicals
  legs:
