- id: bench.meg.dce_vs_sgx_cfr_china
  family: benchmark
  name: DCE ethylene glycol vs SGX MEG CFR China
  sector: chemicals
  legs:
    - {instrument: DCE:EG,   weight: 1.0}
    - {instrument: SGX:MEGF, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  driver_tags: [china_import_arb, meg_import]
  verified: false
  params:
    vat_basis: ex_vat
    arb_bound:
      type: import_parity
      onshore_leg: DCE:EG
      offshore_leg: SGX:MEGF
      freight_usd_t: 0         # SGX is already CFR China
      import_duty: 0.055
      vat_rate: 0.13
      port_charges_cny_t: 50
      formula: "parity_cny_t = offshore_usd_t * USDCNH * (1 + import_duty) * (1 + vat_rate) + port_charges_cny_t; import arb open when onshore_cny_t > parity_cny_t"
  notes: >-
    The right like-for-like pair (the user's Appendix B pairs PTA with SGX MEG, which is wrong).
    China imports about a third of its MEG, so parity is a real bound in the physical market, but
    SGX:MEGF has no open interest: the row has NO DATA until that changes. Kept so the structure
    and the parity arithmetic are on file; an ICIS CFR China index series would be the better leg.

