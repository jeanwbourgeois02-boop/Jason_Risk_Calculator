# =====================================================================
# PROCESSING - the polyester chain
# =====================================================================

- id: proc.cn.px_vs_naphtha
  family: processing
  name: PX minus naphtha (PXN)
  sector: chemicals
  legs:
    - {instrument: ZCE:PX,   weight: 1.0}
    - {instrument: NYMEX:JA, weight: -1.0}
  unit: USD/t
  fx: USDCNH
  tenor: main
  constant: 0
  driver_tags: [polyester_chain, aromatics_margin, gasoline_blending]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: ZCE:PX
    import_duty: 0.02          # context: CFR-equivalent PX = ZCE / 1.13 / 1.02 / USDCNH
    conversion_cost: 280
    conversion_cost_range: [250, 350]
    desk_convention: "PXN = Platts PX CFR Taiwan/China minus MOPJ naphtha, USD/t, plain 1:1"
  notes: >-
    The headline aromatics margin. Quoted 1:1 by convention although a reformer and PX unit
    needs well over 1 t of naphtha per t of PX: the co-products (benzene, raffinate, hydrogen,
    LPG) are credited implicitly, so the level is judged against history, about 250-350 USD/t
    being breakeven for a standalone complex. Summer gasoline blending pulls toluene and mixed
    xylenes away from PX and widens it. The ZCE leg is taken ex-VAT; it still holds the 2% duty
    (about 17 USD/t), which is left in. Needs NYMEX:JA at depth 7 (energy has 4).

- id: proc.cn.pta_processing_fee
  family: processing
  name: PTA processing fee (PTA minus 0.655 PX)
  sector: chemicals
  legs:
    - {instrument: ZCE:TA, weight: 1.0}
    - {instrument: ZCE:PX, weight: -0.655}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [polyester_chain, pta_overcapacity]
  verified: false
  params:
    conversion_cost: 400
    conversion_cost_range: [300, 500]
    desk_convention: "PTA processing fee = TA - 0.655 x PX, CNY/t, same month"
  notes: >-
    Yield: PX C8H10 = 106.17, PTA C8H6O4 = 166.13, so stoichiometry is 106.17 / 166.13 =
    0.639 t PX per t PTA; at about 97.5% yield 0.639 / 0.975 = 0.655, the number every desk uses.
    The fee must also cover about 0.035 t acetic acid, catalyst, energy and depreciation: cash
    cost about 300 CNY/t for the newest 2.5-3 Mt lines, 450-500 for old ones. Chronic
    overcapacity keeps it between 200 and 600; below 300 plants cut runs. Both legs are ZCE,
    same cycle, VAT in on both, so VAT cancels.

- id: proc.cn.psf_margin
  family: processing
  name: Polyester staple fibre processing fee (PF minus 0.855 PTA minus 0.335 EG)
  sector: chemicals
  legs:
    - {instrument: ZCE:PF, weight: 1.0}
    - {instrument: ZCE:TA, weight: -0.855}
    - {instrument: DCE:EG, weight: -0.335}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [polyester_chain, textile_demand]
  verified: false
  params:
    tenor_anchor: ZCE:PF       # PF rolls monthly; TA and EG are taken in PF's main month
    conversion_cost: 1000
    conversion_cost_range: [800, 1200]
  notes: >-
    Yield: PET repeat unit C10H8O4 = 192.17. PTA 166.13 / 192.17 = 0.865 and MEG 62.07 / 192.17
    = 0.323 by stoichiometry; the trade uses 0.855 and 0.335 (MEG losses and DEG formation push
    MEG up, PTA is rounded down). Polymerisation cost = 0.855 TA + 0.335 EG; spinning and
    overheads for staple are about 800-1200 CNY/t on top. EG's off-cycle months are thin, so the
    anchored EG price can be stale; if that shows, drop the anchor and accept the calendar noise.

- id: proc.cn.bottle_chip_margin
  family: processing
  name: PET bottle chip processing fee (PR minus 0.855 PTA minus 0.335 EG)
  sector: chemicals
  legs:
    - {instrument: ZCE:PR, weight: 1.0}
    - {instrument: ZCE:TA, weight: -0.855}
    - {instrument: DCE:EG, weight: -0.335}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [polyester_chain, pet_export, beverage_season]
  verified: false
  params:
    tenor_anchor: ZCE:PR
    conversion_cost: 550
    conversion_cost_range: [450, 700]
  notes: >-
    Same 0.855 / 0.335 arithmetic as staple fibre (bottle grade also carries about 2% isophthalic
    acid, ignored). The quoted processing fee has been crushed to 300-600 CNY/t by the 2023-25
    capacity wave; about 500-600 is cash breakeven (confidence: low). China exports a third of
    its bottle chip, so anti-dumping cases and freight matter. Summer beverage season is the
    seasonal high.

- id: proc.cn.pta_vs_brent
  family: processing
  name: PTA vs Brent (polyester chain vs crude)
  sector: chemicals
  legs:
    - {instrument: ZCE:TA, weight: 1.0}
    - {instrument: ICE:B,  weight: -1.0, qty_factor: 0.13643}
  unit: USD/t
  fx: USDCNH
  tenor: main
  constant: 0
  driver_tags: [chemicals_vs_crude, polyester_chain]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: ZCE:TA
  notes: >-
    qty_factor 0.13643 t per bbl = 1 / 7.33, so Brent becomes USD/t (Brent x 7.33). Tonne for
    tonne by convention, not a yield: the chain is crude -> naphtha -> PX (PXN) -> PTA (0.655),
    so this is PXN plus the PTA fee plus the naphtha crack in one number. PTA is the Chinese
    chemical most correlated with crude and the usual vehicle for "chemicals vs oil".

- id: proc.cn.pta_vs_sc
  family: processing
  name: PTA vs INE crude (domestic chemicals vs crude)
  sector: chemicals
  legs:
    - {instrument: ZCE:TA, weight: 1.0}
    - {instrument: INE:SC, weight: -1.0, qty_factor: 0.13643}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [chemicals_vs_crude, polyester_chain]
  verified: false
  notes: >-
    The onshore version: no FX leg, both legs tradable in one account. SC x 7.33 = CNY/t of
    crude. Prices as quoted: TA includes 13% VAT, SC is bonded (no duty or VAT), so about 11.5%
    of the TA price is tax. Each leg uses its own main contract (SC rolls monthly, TA is 1/5/9),
    so the SC curve shape is inside the number.

# =====================================================================
# PROCESSING - olefins: methanol, propane, naphtha and crude routes
# =====================================================================

- id: proc.cn.mto_pp_margin
  family: processing
  name: MTO margin, polypropylene (PP minus 3 methanol)
  sector: chemicals
  legs:
    - {instrument: DCE:PP, weight: 1.0}
    - {instrument: ZCE:MA, weight: -3.0}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [mto_margin, methanol_demand, olefins_cost_curve]
  verified: false
  params:
    conversion_cost: 900
    conversion_cost_range: [600, 1200]
    desk_convention: "PP - 3 x MA, same 1/5/9 month; desks trade it 3 MA lots (10 t) per 2 PP lots (5 t)"
  notes: >-
    Yield: methanol CH3OH = 32.04 gives one CH2 unit (14.03), so 2.28 t methanol per t olefin at
    100% selectivity; at about 78-80% selectivity to ethylene plus propylene it is 2.85-3.0.
    Desks use 3. Coastal MTO plants buy methanol and are about half of marginal methanol demand:
    when PP - 3MA falls below roughly 600-900 CNY/t they shut, which caps methanol. The most
    traded cross-exchange chemical spread in China.

- id: proc.cn.mto_lldpe_margin
  family: processing
  name: MTO margin, LLDPE (L minus 3 methanol)
  sector: chemicals
  legs:
    - {instrument: DCE:L,  weight: 1.0}
    - {instrument: ZCE:MA, weight: -3.0}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [mto_margin, methanol_demand, olefins_cost_curve]
  verified: false
  params:
    conversion_cost: 900
    conversion_cost_range: [600, 1200]
  notes: >-
    Same 3:1 arithmetic as the PP row: an MTO unit makes ethylene and propylene in roughly equal
    parts, so the plant's true margin is the average of the two rows.

- id: proc.cn.pdh_pp_margin
  family: processing
  name: PDH margin, polypropylene (PP minus 1.2 LPG)
  sector: chemicals
  legs:
    - {instrument: DCE:PP, weight: 1.0}
    - {instrument: DCE:PG, weight: -1.2}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [pdh_margin, propane_cost, olefins_cost_curve]
  verified: false
  params:
    conversion_cost: 1500
    conversion_cost_range: [1200, 1800]
    desk_convention: "PP - 1.2 x PG, each leg's main contract"
  notes: >-
    Yield: propane C3H8 44.10 -> propylene C3H6 42.08 is 1.048 by stoichiometry; at 87-90%
    selectivity 1.16-1.20 t propane per t propylene, times about 1.01 t propylene per t PP =
    1.2. Dehydrogenation costs about 800-1000 CNY/t and polymerisation 500-700 (confidence: low).
    Caveats: DCE:PG delivers mixed LPG and prices the cheapest deliverable, so it is a proxy for
    import propane; PG carries 9% VAT against PP's 13% (about 190 CNY/t of the level); PG rolls
    monthly and is strongly seasonal, so PP main vs PG main embeds the winter LPG premium.

- id: proc.cn.pdh_pp_margin_afei
  family: processing
  name: PDH margin on import propane (PP minus 1.2 AFEI propane)
  sector: chemicals
  legs:
    - {instrument: DCE:PP,   weight: 1.0}
    - {instrument: NYMEX:7E, weight: -1.2}
  unit: USD/t
  fx: USDCNH
  tenor: main
  constant: 0
  driver_tags: [pdh_margin, propane_cost, us_china_tariffs]
  verified: false
  params:
    vat_basis: ex_vat
    tenor_anchor: DCE:PP
    propane_import_duty: 0.01  # context; US-origin cargoes have carried extra tariffs on and off since 2018
    conversion_cost: 210
    conversion_cost_range: [170, 250]
  notes: >-
    The cleaner PDH margin: Chinese PDH plants run on imported propane priced off CP and the
    Argus Far East Index, not on DCE's mixed LPG. Same 1.2 yield as proc.cn.pdh_pp_margin. PP is
    taken ex-VAT so both legs are tax-free. Needs NYMEX:7E at depth 7 (energy has 5).

- id: proc.cn.pdh_propylene_margin
  family: processing
  name: PDH margin, propylene (PL minus 1.2 LPG)
  sector: chemicals
  legs:
    - {instrument: ZCE:PL, weight: 1.0}
    - {instrument: DCE:PG, weight: -1.2}
  unit: CNY/t
  fx: null
  tenor: main
  constant: 0
  driver_tags: [pdh_margin, propane_cost]
  verified: false
  params:
    tenor_anchor: ZCE:PL
    conversion_cost: 900
    conversion_cost_range: [700, 1100]
  notes: >-
    Propylene is the actual PDH product, so this strips the polymerisation step out of the PP
    row: 1.16-1.20 t propane per t propylene, taken as 1.2. ZCE:PL only listed in Jul 2025, so
