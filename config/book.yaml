# Which rows of the uploaded blotter export are the book's (read by
# data/ingest/blotter.py::load_book_filter; owned by the ingest-parser lane).
#
# Each list keeps only the rows whose cell in that column is one of its names, compared
# without regard to case. An empty list takes every value. A blank cell, or an export
# with no such column, never excludes a row (hard rule 6). A row is counted under the
# first filter that excludes it, in the order funds, traders, desks; the upload summary
# counts them, with the rows kept per trader.
#
# Columns: funds -> 'Fund', traders -> 'Trader', desks -> 'Desk'.
#
# Every list is empty (user, 2026-09-28): the export Jason uploads is his own pull from the
# prime broker and holds only his trades, so nothing is filtered. It has no Fund or Desk
# column at all (Trader is 'JS'). The lists stay as a safety net to fill in if a shared
# export ever appears. The synthetic sample (data/sample/blotter_sample.csv) books every
# row as Trader 'JB', Fund 'NMMF', and loads whole under an empty list.

funds: []
traders: []
desks: []
