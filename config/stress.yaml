# Named stress scenarios: scenario -> {currency: pct move against USD}. A currency
# strengthening against USD is a positive pct. Loaded by engine/pnl/stress.py::load_scenarios.
# docs/BUILD_PLAN.md section 4. A scenario is currency moves only.
#
# User decision 2026-09-15 ("Reorder the Ladder tab", item 3): a fuller, serious set the
# user can edit later. Scenario dict order here is preserved as the risk table's column
# order (engine/pnl/stress.py::load_scenarios keeps insertion order; do not alphabetise
# when editing).
#
# Commodity conversion Phase 2 (2026-09-24):
# - CNH, the biggest FX hedge currency of Jason's book, moves in every scenario that moves
#   the whole dollar or Asian / EM FX, at the Asian-EM size: the dollar moves, -8 % risk-off,
#   +5 % risk-on, -10 % EM, -5 % Asia. It does not move in "Europe -3%" or
#   "Commodity FX +5%", which move neither. The recommendation taken; a smaller,
#   managed-currency size like SGD's (-4 % / +3 %) is the alternative.
# - A scenario moves currencies only: no index or rates key.
# The book's FX currencies (the sample blotter's FX hedges and options: EUR, GBP, JPY, CNH,
# XAU) each have a move in at least one scenario.

